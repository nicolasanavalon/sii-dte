name: "Correo: sincronizar"

# VIGILANTE: queda encendido ~5 horas y 45 minutos revisando Zoho CADA MINUTO (los horarios programados de GitHub
# se atrasan horas, por eso no se usan para esto). Al terminar se relanza solo; el horario cada 30 minutos es
# solo un respaldo por si la cadena se corta (si ya hay uno encendido, el nuevo espera su turno).
#
# Cada vuelta guarda los datos CIFRADOS en la rama correo-datos (la página los lee de ahí cada 30 segundos)
# y, una vez por hora, completa correos antiguos, resume más conversaciones y republica la página.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      forzar:
        description: "(sin uso, se mantiene por compatibilidad)"
        type: boolean
        default: false
      rapido:
        description: "(sin uso, se mantiene por compatibilidad)"
        type: boolean
        default: false

permissions:
  contents: write   # rama correo-datos y correo-adjuntos (todo cifrado)
  actions: write    # relanzarse y pedir la publicación de la página

# Uno solo a la vez. Ojo: NO usa el grupo "pages", para no bloquear la publicación del DTE.
concurrency:
  group: correo-vigilante
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - run: echo "INICIO=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: correo/requirements.txt

      - name: Instalar dependencias (y OCR para leer fotos y PDF escaneados)
        run: |
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa >/dev/null
          pip install -r correo/requirements.txt

      - name: Traer datos y adjuntos guardados (cifrados)
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          for r in datos adjuntos; do
            git clone -q --depth 1 --branch "correo-$r" "$REPO_URL" "$RUNNER_TEMP/$r" \
              || { mkdir -p "$RUNNER_TEMP/$r" && git -C "$RUNNER_TEMP/$r" init -q; }
          done
          mkdir -p "$RUNNER_TEMP/adjuntos/adj"
          cat > "$RUNNER_TEMP/guardar.sh" <<'EOS'
          # $1 = 1 si cambiaron los datos; $2 = 1 si fue la vuelta completa (cada hora)
          subir() {   # rama de un solo commit (sin historial): no llena el repo
            cd "$RUNNER_TEMP/$1" || return
            git checkout -q --orphan "n$(date +%s)" 2>/dev/null
            git add -A . && git -c user.name=correo-bot -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit -q -m "$2" || return 0
            for i in 1 2 3; do git push -q -f "$REPO_URL" "HEAD:correo-$1" && return 0; sleep 5; done
          }
          subir datos "Correo: datos cifrados"
          if [ "$1" = 1 ]; then subir adjuntos "Adjuntos cifrados"; fi
          if [ "$2" = 1 ] && [ "$1" = 1 ]; then gh workflow run correo_publicar.yml --ref main -R "$GITHUB_REPOSITORY" || true; fi
          EOS

      - name: Revisar Zoho cada minuto
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          GH_TOKEN: ${{ github.token }}
          CORREO_GUARDAR: ${{ runner.temp }}/guardar.sh
          CORREO_DATOS_DIR: ${{ runner.temp }}/datos
          CORREO_ADJ_DIR: ${{ runner.temp }}/adjuntos/adj
          CORREO_SALIDA: ${{ runner.temp }}/index.html
          CORREO_CLAVE: ${{ secrets.CORREO_CLAVE }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_TALLER_CLIENT_ID: ${{ secrets.ZOHO_TALLER_CLIENT_ID }}
          ZOHO_TALLER_CLIENT_SECRET: ${{ secrets.ZOHO_TALLER_CLIENT_SECRET }}
          ZOHO_DC: ${{ vars.ZOHO_DC }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN_ENVIO: ${{ secrets.GH_TOKEN_ENVIO }}
          GROQ_MODELO: ${{ vars.GROQ_MODELO }}
          CORREO_DIAS_INICIALES: ${{ vars.CORREO_DIAS_INICIALES }}
          CORREO_MAX_POR_CORRIDA: ${{ vars.CORREO_MAX_POR_CORRIDA }}
          CORREO_URL: ${{ vars.CORREO_URL || format('https://{0}.github.io/{1}/correo/', github.repository_owner, github.event.repository.name) }}
        run: python correo/sync.py --vigilar 340

      - name: Relanzar el vigilante
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Solo si estuvo encendido un buen rato (si falló al partir, el respaldo de cada 30 min lo reintenta).
          if [ $(( $(date +%s) - INICIO )) -gt 1800 ]; then gh workflow run correo_sync.yml --ref main -R "$GITHUB_REPOSITORY"; fi
