name: "Correo: sincronizar"

# Cada 30 minutos: trae correos nuevos de Zoho, los resume con la IA gratuita de Groq y publica la página cifrada
# en GitHub Pages (https://USUARIO.github.io/REPO/correo/). Si no hay correos nuevos, no publica nada.
on:
  schedule:
    - cron: "7,37 * * * *"   # GitHub puede atrasarlo algunos minutos
  workflow_dispatch:
    inputs:
      forzar:
        description: "Republicar la página aunque no haya correos nuevos"
        type: boolean
        default: false

permissions:
  contents: write   # para guardar los adjuntos CIFRADOS en la rama correo-adjuntos
  pages: write
  id-token: write

# Mismo grupo que la publicación del DTE: así nunca se pisan al publicar en Pages.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias (y OCR para leer fotos y PDF escaneados)
        run: |
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa >/dev/null
          pip install -r correo/requirements.txt

      - name: Traer los adjuntos ya guardados (cifrados)
        run: |
          git clone -q --depth 1 --branch correo-adjuntos "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$RUNNER_TEMP/adj" \
            || { mkdir -p "$RUNNER_TEMP/adj" && git -C "$RUNNER_TEMP/adj" init -q; }
          mkdir -p "$RUNNER_TEMP/adj/adj"

      - name: Sincronizar y resumir
        id: sync
        env:
          CORREO_CLAVE: ${{ secrets.CORREO_CLAVE }}
          CORREO_ADJ_DIR: ${{ runner.temp }}/adj/adj
          GITHUB_REPOSITORY: ${{ github.repository }}
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_TALLER_CLIENT_ID: ${{ secrets.ZOHO_TALLER_CLIENT_ID }}
          ZOHO_TALLER_CLIENT_SECRET: ${{ secrets.ZOHO_TALLER_CLIENT_SECRET }}
          ZOHO_DC: ${{ vars.ZOHO_DC }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_TOKEN_ENVIO: ${{ secrets.GH_TOKEN_ENVIO }}
          GROQ_MODELO: ${{ vars.GROQ_MODELO }}
          CORREO_DIAS_INICIALES: ${{ vars.CORREO_DIAS_INICIALES }}
          CORREO_MAX_POR_CORRIDA: ${{ vars.CORREO_MAX_POR_CORRIDA }}
          CORREO_URL: ${{ vars.CORREO_URL || format('https://{0}.github.io/{1}/correo/', github.repository_owner, github.event.repository.name) }}
        run: python correo/sync.py ${{ inputs.forzar && '--forzar' || '' }}

      - name: Guardar los adjuntos (cifrados) en la rama correo-adjuntos
        run: |
          cd "$RUNNER_TEMP/adj"
          git checkout -q --orphan nuevo
          git add -A adj
          git -c user.name=correo-bot -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -q -m "Adjuntos cifrados" || exit 0
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:correo-adjuntos

      - name: Armar el sitio (DTE + correo)
        if: steps.sync.outputs.cambio == 'true' || inputs.forzar
        run: |
          mkdir -p public/correo
          cp index.html public/index.html
          cp correo/index.html public/correo/index.html

      - uses: actions/upload-pages-artifact@v3
        if: steps.sync.outputs.cambio == 'true' || inputs.forzar
        with:
          path: public

      - uses: actions/deploy-pages@v4
        if: steps.sync.outputs.cambio == 'true' || inputs.forzar
