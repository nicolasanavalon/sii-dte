name: Reporte horario Pulso de venta

on:
  schedule:
    - cron: "5 * * * *"   # cada hora (UTC); el script solo envía dentro de REPORT_HOURS hora Chile
  workflow_dispatch: {}   # permite probarlo a mano desde la pestaña Actions

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enviar reporte
        env:
          REPORT_HOURS: "9-22"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python report_pulso.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
