name: Reporte horario Pulso de venta

on:
  schedule:
    # A los :03 y :33 de cada hora. GitHub usa UTC: este rango cubre el horario de Chile
    # con y sin horario de verano; el script solo envía entre 10:00 y 20:30 hora Chile.
    - cron: "3,33 13-23,0 * * *"
  workflow_dispatch: {}   # permite probarlo a mano desde la pestaña Actions

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enviar reporte
        env:
          REPORT_WINDOW: "10:00-20:30"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python report_pulso.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
