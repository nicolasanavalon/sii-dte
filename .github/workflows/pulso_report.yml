name: Reporte horario Pulso de venta

# Disparo principal: cron-job.org llama a este workflow (workflow_dispatch) a las :03 y :33,
# de 10:03 a 20:03 hora Chile, porque el cron propio de GitHub suele atrasarse o saltarse.
# Respaldo: el cron de GitHub corre 10 minutos después y solo envía si el principal no salió.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Enviar aunque esté fuera de horario (para probar)"
        type: boolean
        default: false
  schedule:
    # UTC; este rango cubre Chile con y sin horario de verano. El script filtra por hora Chile.
    - cron: "13,43 13-23,0 * * *"

permissions:
  actions: write  # el respaldo revisa corridas anteriores; a las 08:03 dispara el reporte DTE
  contents: read

concurrency:
  group: pulso-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # El disparo de cron-job.org de las 08:03 hora Chile lanza el reporte diario de pagos DTE.
      - name: Lanzar reporte DTE de las 08:00
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(TZ=America/Santiago date +%H)" = "08" ] && [ "$(TZ=America/Santiago date +%M)" -lt 30 ]; then
            gh workflow run dte_report.yml --ref main
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enviar reporte
        env:
          REPORT_WINDOW: "10:00-20:30"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_EXTRA: "8991687548"   # destinatarios adicionales, separados por coma
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python report_pulso.py
          ${{ github.event_name == 'schedule' && '--backup' || '' }}
          ${{ inputs.force && '--force' || '' }}
