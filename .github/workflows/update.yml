name: Actualizar DTE desde SII

on:
  schedule:
    - cron: "0 11 * * *"   # ~07:00 hora de Chile (GitHub usa UTC; puede haber atrasos de minutos)
  workflow_dispatch: {}     # permite ejecutarlo a mano desde la pestaña Actions
  push:
    branches: [main]
    paths:                  # si se sube un cambio de código, se reconstruye y publica solo
      - "dashboard_template.html"
      - "fetch_sii.py"
      - "requirements.txt"
      - ".github/workflows/update.yml"

permissions:
  contents: write   # para guardar los CSV y el index.html en el repo
  pages: write      # para publicar en GitHub Pages
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Descargar del SII y generar el sitio
        env:
          SII_RUT: ${{ secrets.SII_RUT }}
          SII_CLAVE: ${{ secrets.SII_CLAVE }}
          SII_MESES: "2"
          MS_REFRESH_TOKEN: ${{ secrets.MS_REFRESH_TOKEN }}
        run: python fetch_sii.py

      - name: Guardar datos actualizados en el repo
        run: |
          git config user.name "sii-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data index.html
          git commit -m "Actualiza DTE ($(TZ=America/Santiago date +%Y-%m-%d))" || echo "Sin cambios"
          git push || echo "Nada que empujar"

      - name: Preparar artefacto de Pages
        env:
          CORREO_URL: ${{ vars.CORREO_URL || format('https://{0}.github.io/{1}/correo/', github.repository_owner, github.event.repository.name) }}
        run: |
          mkdir -p public/correo
          cp index.html public/index.html
          # Conserva la página de correo ya publicada (Pages reemplaza el sitio completo en cada publicación).
          code=$(curl -sS -L --retry 3 -o public/correo/index.html -w "%{http_code}" "${CORREO_URL}?nocache=$(date +%s)" || echo 000)
          if [ "$code" = "404" ]; then
            rm -rf public/correo   # aún no existe la página de correo
          elif [ "$code" != "200" ]; then
            echo "::error::No pude leer la página de correo publicada (HTTP $code); no publico para no borrarla."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Guardar captura de diagnóstico si el login falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: login_error
          path: login_error.png
          if-no-files-found: ignore

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
