name: Actualizar DTE desde SII

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Descargar del SII y generar el sitio
        env:
          SII_RUT: ${{ secrets.SII_RUT }}
          SII_CLAVE: ${{ secrets.SII_CLAVE }}
          SII_MESES: "2"
          MS_REFRESH_TOKEN: ${{ secrets.MS_REFRESH_TOKEN }}
        run: python fetch_sii.py

      - name: Guardar datos actualizados en el repo
        run: |
          git config user.name "sii-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data index.html
          git commit -m "Actualiza DTE" || echo "Sin cambios"
          git push || echo "Nada que empujar"

      - name: Preparar artefacto de Pages
        run: |
          mkdir -p public
          cp index.html public/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Guardar captura de diagnóstico si el login falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: login_error
          path: login_error.png
          if-no-files-found: ignore

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
