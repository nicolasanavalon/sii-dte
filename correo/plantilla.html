<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Bandeja Zoho</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" href="icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zoho">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: bandeja tipo correo (lista | correo abierto) + vista de preguntas a la IA. Una columna en el teléfono. */
:root{
  --bg:#ffffff; --panel:#ffffff; --ink:#151a24; --muted:#5d6676; --line:#dfe3ea; --soft:#f1f3f7;
  --accent:#2747b8; --accent-ink:#ffffff; --accent-soft:#e6ebfa; --mark:#fff1a8;
  --alta:#b23a1c; --alta-soft:#fbe8e1; --ok:#1f7a55; --ok-soft:#e1f2ea;
  --f-display:"Instrument Sans","Inter",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:10px; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font:15px/1.5 var(--f-body); padding-top:env(safe-area-inset-top,0px)}
button,input{font:inherit; color:inherit}
a{color:var(--accent)}
mark{background:var(--mark); color:inherit; border-radius:2px; padding:0 1px}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:13px}
h1{font:600 21px/1.2 var(--f-display); margin:0; letter-spacing:-.01em}
h2{font:600 19px/1.3 var(--f-display); margin:0; text-wrap:balance; overflow-wrap:anywhere}
h3{font:600 12.5px/1.3 var(--f-display); margin:0; text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}

.lock{min-height:100vh; display:grid; place-items:center; padding:16px}
.lockbox{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:28px; width:100%; max-width:360px; display:flex; flex-direction:column; gap:12px}
.lockbox input[type=password]{padding:11px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg)}

.app{max-width:1320px; margin:0 auto; padding-block:calc(14px + env(safe-area-inset-top, 0px)) 28px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); display:flex; flex-direction:column; gap:12px}
header{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px 18px}
.tabs{display:flex; gap:4px; background:var(--soft); padding:4px; border-radius:999px}
.tab{border:0; background:none; padding:7px 18px; border-radius:999px; cursor:pointer; color:var(--muted); font-weight:500}
.tab[aria-selected="true"]{background:var(--panel); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn{border:0; background:var(--accent); color:var(--accent-ink); padding:10px 16px; border-radius:8px; cursor:pointer; font-weight:600; white-space:nowrap}
.btn:disabled{opacity:.55; cursor:default}
.chip{border:1px solid var(--line); background:var(--panel); border-radius:999px; padding:4px 11px; font-size:13px; cursor:pointer; color:var(--muted); white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}

/* Correos */
.toolbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.search{flex:1 1 320px; min-width:0; position:relative}
.search input{width:100%; padding:11px 42px 11px 38px; border:1px solid var(--line); border-radius:10px; background:var(--panel)}
.limpiar-busca{position:absolute; right:8px; top:50%; transform:translateY(-50%); border:0; background:var(--soft); color:var(--muted);
  width:28px; height:28px; border-radius:50%; cursor:pointer; font-size:14px; display:grid; place-items:center}
.search input::-webkit-search-cancel-button{display:none}
.search svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted)}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.salto{display:none}
.campo-busca{padding:10px 10px; border:1px solid var(--line); border-radius:10px; background:var(--panel); font:inherit; color:var(--ink)}
.row.hist{background:repeating-linear-gradient(0deg, transparent, transparent)}
.tag.hist{background:#eef1f6; color:#4a5568}
.hist-caja{border:1px dashed var(--line); border-radius:10px; padding:14px 16px; display:flex; flex-direction:column; gap:10px}
.split{display:grid; grid-template-columns:minmax(300px, 420px) minmax(0, 1fr); gap:12px; align-items:start}
.list{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.count{padding:8px 14px; border-bottom:1px solid var(--line); font-size:12.5px; color:var(--muted)}
.rows{max-height:calc(100vh - 210px); overflow:auto}
.row{display:block; width:100%; text-align:left; border:0; border-top:1px solid var(--line); background:none; padding:10px 14px; cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--soft)}
.row[aria-current="true"]{background:var(--accent-soft)}
.row.nl{position:relative; background:color-mix(in srgb, var(--accent-soft) 45%, var(--panel))}
.row.nl::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent)}
.row.nl .who, .row.nl .subj{font-weight:700; color:var(--ink)}
.row.nl .who::before{content:""; display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--accent); margin-right:7px; vertical-align:1px}
.r1{display:flex; justify-content:space-between; gap:8px; align-items:baseline}
.who{font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.when{font-size:12px; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums}
.subj{font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.snip{font-size:12.5px; color:var(--muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere}
.tags{display:flex; gap:4px; flex-wrap:wrap; margin-top:3px}
.tag{font-size:11px; padding:0 7px; border-radius:999px; background:var(--soft); color:var(--muted); white-space:nowrap}
.tag.acc{background:var(--accent-soft); color:var(--accent)} .tag.ok{background:var(--ok-soft); color:var(--ok)} .tag.alta{background:var(--alta-soft); color:var(--alta)}
.more{display:block; width:100%; border:0; border-top:1px solid var(--line); background:none; padding:12px; color:var(--accent); cursor:pointer; font-weight:500}

.read{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:18px 20px; display:flex; flex-direction:column; gap:14px; min-width:0}
.meta{display:grid; grid-template-columns:auto 1fr; gap:2px 12px; font-size:13.5px; margin:0}
.meta dt{color:var(--muted)} .meta dd{margin:0; overflow-wrap:anywhere}
.actions{display:flex; gap:8px; flex-wrap:wrap}
.resumen{background:var(--soft); border-radius:8px; padding:12px 14px; display:flex; flex-direction:column; gap:6px}
.resumen p{margin:0} .resumen ul{margin:0; padding-left:20px; font-size:14px}
.cuerpo{white-space:pre-wrap; overflow-wrap:anywhere; font-size:14px; line-height:1.55}
.file{border:1px solid var(--line); border-radius:8px; padding:8px 12px}
.file summary{cursor:pointer; font-size:13.5px}
.file pre{white-space:pre-wrap; overflow-wrap:anywhere; font:12px/1.45 var(--f-mono); max-height:360px; overflow:auto; margin:8px 0 0}
.hilo{display:flex; flex-direction:column; border:1px solid var(--line); border-radius:8px; overflow:hidden}
.hilo .row{padding:8px 12px}
.back{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--panel); color:var(--accent); padding:6px 12px; border-radius:8px; cursor:pointer; align-self:flex-start; font-weight:600}
.back:hover{background:var(--accent-soft)}
.casillas{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.casillas .lbl{font-size:12.5px; color:var(--muted)}
.seg{display:flex; gap:2px; background:var(--soft); padding:3px; border-radius:10px; flex-wrap:wrap}
.seg button{border:0; background:none; padding:6px 12px; border-radius:8px; cursor:pointer; color:var(--muted); font-weight:500; font-size:14px}
.carpetas button{font-size:15px; padding:8px 14px}
.seg .nl-n{color:var(--accent); font-weight:700}
.seg button[aria-pressed="true"]{background:var(--panel); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08)}
.progreso{display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; font-size:12.5px; color:var(--muted)}
.barra{width:140px; height:6px; background:var(--soft); border-radius:999px; overflow:hidden}
.barra i{display:block; height:100%; background:var(--accent); border-radius:999px}
.progreso b{color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums}
.vacio{color:var(--muted); text-align:center; padding:40px 16px; margin:0}

.sinc{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.acciones{display:flex; align-items:center; gap:10px 18px; flex-wrap:wrap}
.movil{display:none}
.avance{position:fixed; z-index:30; top:calc(env(safe-area-inset-top, 0px) + 70px); right:16px; left:auto; width:min(420px, calc(100vw - 32px));
  background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:0 12px 32px rgba(20,26,40,.18); padding:14px 16px; display:flex; flex-direction:column; gap:12px}
.avance h3{display:flex; justify-content:space-between; align-items:center}
.avance .fila-av{display:flex; flex-direction:column; gap:4px; font-size:13.5px}
.avance .barra2{height:8px; border-radius:99px; background:var(--soft); overflow:hidden}
.avance .barra2 i{display:block; height:100%; background:var(--accent)}
.avance .barra2.idx i{background:#9db0e8}
.avance.od{max-height:calc(100vh - 110px); overflow:auto}
.od pre{background:var(--soft); border-radius:8px; padding:8px 10px; font-size:12px; white-space:pre-wrap; word-break:break-all; margin:0; user-select:all}
.od textarea{width:100%; min-height:90px; font-size:16px; border:1px solid var(--line); border-radius:8px; padding:8px; box-sizing:border-box}
.od select{width:100%; font-size:15px; padding:6px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:inherit}
.od ol{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:6px; font-size:14px}
.od .prov{display:flex; flex-direction:column; gap:6px; padding:10px; border:1px solid var(--line); border-radius:10px}
.od-num{background:var(--alta); color:#fff; border-radius:99px; padding:0 6px; font-size:11px; margin-left:4px}
.od-ok{font-size:13px; color:var(--muted); margin:6px 0 0}
.estrella{cursor:pointer; color:#b9bfcc; font-size:17px; line-height:1; padding:0 2px 0 6px; user-select:none}
.estrella.on{color:#f2b01e}
.row .r1{display:flex; align-items:baseline}
.row .r1 .when{margin-left:auto}
.row .avatar.mini, .row .clip{display:none}
/* App en la pantalla de inicio del iPhone: el iPhone difumina la franja de arriba; el contenido parte más abajo. */
@media (display-mode: standalone) and (max-width:860px){ .app{padding-top:calc(env(safe-area-inset-top, 0px) + 34px)} }
/* Lista compacta como la app de Zoho (avatar, de quién, hora y asunto), en el computador y en el celular. */
@media all{
  .row{display:grid; grid-template-columns:40px minmax(0,1fr); column-gap:12px; padding:11px 14px; align-items:center}
  .row .avatar.mini{display:grid; width:40px; height:40px; font-size:14px; grid-row:1 / span 2}
  .row .r1, .row .subj{grid-column:2}
  .row .subj{display:flex; gap:8px; align-items:center}
  .row .subj-t{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .row .clip{display:inline; font-size:13px; opacity:.6}
  .row .snip, .row .tags{display:none}
  .row.con-busqueda .snip{display:-webkit-box; grid-column:2}          /* al buscar: se ve dónde aparece */
  .row.nl .who::before{width:7px; height:7px; margin-right:6px}
  .row:not(.nl) .who{font-weight:500}
}
/* Celular: botones, estado y salir en una sola fila. */
@media (max-width:600px){
  #vCorreos .toolbar{flex-wrap:wrap}
  #vCorreos .toolbar .carpetas{flex:none; flex-wrap:nowrap}
  #vCorreos .toolbar .carpetas .pc{display:none}
  #vCorreos .toolbar .carpetas button{padding:8px 11px}
  #vCorreos .toolbar .search{flex:1 1 0}
  #vCorreos .toolbar .carpetas{order:1}
  #vCorreos .toolbar .search{order:2; flex:1 1 0; min-width:120px}
  #vCorreos .toolbar .salto{display:block; order:4; flex-basis:100%; height:0}
  #vCorreos .toolbar .campo-busca{order:5; flex:none; padding:6px 8px; font-size:15px}
  #vCorreos .toolbar .chips{order:6; flex:1 1 0; min-width:0; flex-wrap:nowrap; overflow-x:auto}
  .acciones{width:100%; flex-wrap:nowrap; gap:6px}
  .acciones .sinc{flex:1; min-width:0; flex-wrap:nowrap; gap:6px}
  #sincTxt{min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:12px}
  .acciones .pc{display:none} .acciones .movil{display:inline}
  .acciones .chip, .acciones .btn{padding:7px 10px; flex:none}
}
.sinc .girando{display:inline-block; animation:girar 1s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}

/* Lectura tipo Outlook */
.readbar{display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap}
.asunto{font-size:21px; line-height:1.3}
.remite{display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center}
.avatar{width:42px; height:42px; border-radius:50%; display:grid; place-items:center; font-weight:600; font-size:15px; color:#fff; background:hsl(var(--h) 45% 45%)}
.remite-txt{min-width:0; overflow-wrap:anywhere}
.fecha-msg{white-space:nowrap; align-self:start; padding-top:3px}
.adjs{display:flex; flex-wrap:wrap; gap:8px}
.adj{display:inline-flex; align-items:center; gap:8px; max-width:100%; border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:6px 10px; cursor:pointer; font-size:13px}
.adj[aria-expanded="true"]{border-color:var(--accent); background:var(--accent-soft)}
.adj .ext{font:600 10.5px/1 var(--f-mono); background:var(--accent); color:var(--accent-ink); border-radius:4px; padding:4px 5px}
.adj-n{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:220px}
.adj-texto{border:1px solid var(--line); border-radius:8px; padding:10px 12px; background:var(--bg)}
.adj-acc{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:8px}
.adj-acc strong{margin-right:auto; overflow-wrap:anywhere}
.visor-img{display:block; max-width:100%; border-radius:6px; margin:6px 0}
.visor-xls{overflow:auto; max-height:75vh; border:1px solid #c8c8c8; margin:6px 0; background:#fff; -webkit-overflow-scrolling:touch}
.xls{border-collapse:collapse; table-layout:fixed; width:max-content; font:13px/1.25 Aptos, Calibri, "Segoe UI", Arial, sans-serif; color:#000; background:#fff}
.xls td{border:1px solid #e1e1e1; padding:1px 4px; white-space:nowrap; overflow:hidden; text-overflow:clip; vertical-align:bottom}
.xls td.n{text-align:right}
.xls th{background:#f3f3f3; color:#555; font-weight:400; font-size:11.5px; border:1px solid #d4d4d4; padding:0 3px; text-align:center}
.xls thead th{position:sticky; top:0; z-index:2; height:20px}
.xls tbody th{position:sticky; left:0; z-index:1}
.xls th.esq{left:0; z-index:3}
.xls-lienzo{position:relative; width:max-content}
.xls-img{position:absolute; pointer-events:none; object-fit:fill}
.pantalla{position:fixed; inset:0; z-index:50; background:#f1f2f4; display:flex; flex-direction:column}
.pbar{display:flex; align-items:center; gap:8px; padding:calc(env(safe-area-inset-top, 0px) + 8px) 10px 8px; background:#fff; border-bottom:1px solid var(--line)}
.pnombre{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:15px}
.pbtn{border:1px solid var(--line); background:#fff; border-radius:10px; min-width:40px; height:40px; font-size:18px; cursor:pointer; color:var(--ink)}
.pzoom{display:flex; align-items:center; gap:4px; font-size:13px; color:var(--muted)}
.ptabs{display:flex; gap:6px; overflow-x:auto; padding:8px 10px; background:#fff; border-bottom:1px solid var(--line)}
.ptabs .chip{flex:none}
.pcuerpo{flex:1; overflow:auto; -webkit-overflow-scrolling:touch; padding:10px; padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 10px)}
.pcuerpo canvas{display:block; margin:0 auto 10px; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.18)}
.pcuerpo img.pimg{display:block; margin:0 auto; max-width:none}
.pcuerpo pre{white-space:pre-wrap; background:#fff; padding:14px; border-radius:8px; font:13px/1.5 var(--f-mono)}
.pcuerpo .xls-caja{background:#fff; width:max-content; margin:0 auto; box-shadow:0 1px 4px rgba(0,0,0,.18)}
.pcuerpo .cargando{color:var(--muted); text-align:center; padding:40px 0}
.zoom-xls{display:flex; gap:6px; align-items:center; margin:6px 0 0}
.zoom-xls button{min-width:36px}
.visor-doc{display:block; width:100%; height:75vh; border:1px solid var(--line); border-radius:6px; background:#fff; margin:6px 0}
.adj-texto pre{white-space:pre-wrap; overflow-wrap:anywhere; font:12px/1.45 var(--f-mono); max-height:360px; overflow:auto; margin:6px 0 0}
.hoja{background:#fff; color:#1f2328; border:1px solid var(--line); border-radius:8px; overflow:hidden}
.hoja .cuerpo{padding:18px 20px}
.correo-html{display:block; width:100%; border:0; height:300px; background:#fff}
.enlace{border:0; background:none; color:var(--accent); cursor:pointer; padding:0; align-self:flex-start}
details.resumen summary{cursor:pointer; list-style:none} details.resumen summary::-webkit-details-marker{display:none}
@media (max-width:560px){ .remite{grid-template-columns:auto 1fr} .fecha-msg{grid-column:2} .hoja .cuerpo{padding:14px} }

.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(18px + env(safe-area-inset-bottom, 0px)); z-index:50;
  background:#1d2433; color:#fff; padding:12px 16px; border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.25); font-size:14.5px;
  display:flex; gap:12px; align-items:center; max-width:calc(100% - 32px)}
.toast.bien{background:#176a49} .toast.mal{background:#9b2f17}
.toast .btn.sec{background:#fff; color:#1d2433}

/* Sugerencias de contactos */
.campo{position:relative}
.compose .campo-dest{display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:var(--bg); cursor:text}
.compose .campo-dest input{flex:1; min-width:140px; border:0; padding:4px 2px; background:transparent; outline:none}
.compose .campo-dest:focus-within{border-color:var(--accent)}
.dest{display:inline-flex; align-items:center; gap:4px; background:var(--accent-soft); color:var(--accent); border-radius:999px; padding:3px 4px 3px 10px; font-size:14px; max-width:100%; overflow-wrap:anywhere}
.dest button{border:0; background:transparent; color:var(--accent); cursor:pointer; font-size:13px; width:22px; height:22px; border-radius:50%}
.sugs{position:absolute; left:0; right:0; top:100%; margin-top:4px; background:#fff; border:1px solid var(--line); border-radius:8px;
  box-shadow:0 8px 24px rgba(20,26,40,.14); z-index:20; max-height:280px; overflow:auto}
.sug{display:flex; gap:10px; align-items:center; width:100%; text-align:left; border:0; background:none; padding:8px 12px; cursor:pointer; color:var(--ink)}
.sug[aria-selected="true"], .sug:hover{background:var(--accent-soft)}
.sug .avatar{width:30px; height:30px; font-size:12px; flex:none}
.sug .t{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sug .t small{color:var(--muted)}

/* Responder */
.compose{border:1px solid var(--accent); border-radius:10px; padding:14px; display:flex; flex-direction:column; gap:10px; background:var(--panel)}
.compose label{font-size:12.5px; color:var(--muted); display:flex; flex-direction:column; gap:4px}
.compose label.check{flex-direction:row; align-items:center; gap:8px; color:var(--ink); font-size:14px}
.compose label.check input{width:auto}
.compose select{width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--bg); font:inherit; color:inherit}
.compose input, .compose textarea{width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--bg); font:inherit; color:inherit}
.adjuntar{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.compose .adjuntar label.btn{display:inline-flex; flex-direction:row; color:var(--ink); font-size:14px; cursor:pointer}
.adj-chip{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:999px; padding:4px 6px 4px 11px; font-size:13px; max-width:100%; overflow-wrap:anywhere}
.adj-chip button{border:0; background:var(--soft); border-radius:50%; width:22px; height:22px; cursor:pointer; color:var(--muted)}
.compose-top{display:none}
.seguir-escribiendo{position:sticky; bottom:12px; align-self:center; box-shadow:0 6px 18px rgba(20,26,40,.25)}
/* Celular: al responder, el editor ocupa toda la pantalla y el mensaje usa todo el espacio libre. */
@media (max-width:860px){
  .compose{position:fixed; inset:0; z-index:45; border:0; border-radius:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:0 14px calc(env(safe-area-inset-bottom, 0px) + 16px); gap:8px}
  .compose > h3{display:none}
  .compose-top{display:flex; align-items:center; gap:8px; position:sticky; top:0; z-index:2; background:var(--panel);
    margin:0 -14px; padding:calc(env(safe-area-inset-top, 0px) + 8px) 14px 8px; border-bottom:1px solid var(--line)}
  .compose-top strong{flex:1; min-width:0; text-align:center; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .compose-top .btn{padding:8px 12px}
  .compose textarea#rTexto{min-height:max(260px, calc(100dvh - 400px))}
  body.escribiendo{overflow:hidden}
}
.compose textarea{min-height:190px; resize:vertical; line-height:1.5}
.btn.sec{background:var(--soft); color:var(--ink); font-weight:500}
.btn.peligro{background:var(--alta); color:#fff}
.obs{background:var(--soft); border-radius:8px; padding:10px 12px; font-size:14px; display:flex; flex-direction:column; gap:6px}
.obs ul{margin:0; padding-left:20px}
.obs .ok{color:var(--ok); font-weight:600}
.estadoEnvio{font-size:14px; font-weight:500}
.estadoEnvio.bien{color:var(--ok)} .estadoEnvio.mal{color:var(--alta)}
textarea{font:inherit}

/* Preguntar */
.chat{max-width:860px; width:100%; margin:0 auto; display:flex; flex-direction:column; gap:12px}
.ctx{display:flex; align-items:center; flex-wrap:wrap; gap:8px; background:var(--accent-soft); color:var(--accent); border-radius:8px; padding:8px 12px; font-size:13.5px}
.ctx button{border:0; background:none; color:inherit; cursor:pointer; margin-left:auto; font-weight:600}
.ask{display:flex; gap:8px; background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:10px}
.mic{padding:10px 13px; font-size:18px; line-height:1}
.mic.grabando{background:var(--alta); color:#fff; animation:latido 1.2s ease-in-out infinite}
@keyframes latido{50%{opacity:.65}}
#micTxt{margin:-4px 2px 0}
.ask input{flex:1; min-width:0; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg)}
.qa{display:flex; flex-direction:column; gap:12px}
.q{align-self:flex-end; background:var(--accent); color:var(--accent-ink); padding:9px 14px; border-radius:14px 14px 4px 14px; max-width:85%; overflow-wrap:anywhere}
.a{align-self:flex-start; background:var(--panel); border:1px solid var(--line); padding:12px 16px; border-radius:14px 14px 14px 4px; max-width:100%; overflow-wrap:anywhere}
.a p{margin:0 0 8px} .a p:last-child{margin:0} .a ul{margin:0 0 8px; padding-left:20px}
.hint{color:var(--muted); font-size:13px; text-align:center; margin:0}

@media (max-width:860px){
  .split{grid-template-columns:minmax(0,1fr)}
  .split.abierto .list{display:none}
  .split:not(.abierto) .read{display:none}
  .rows{max-height:none}
}
/* Computador: toda la pantalla, como Outlook (lista y correo a lo alto, cada uno con su scroll). */
@media (min-width:861px){
  .app{max-width:none; height:100vh; height:100dvh; padding-block:12px 12px}
  #vCorreos{flex:1; min-height:0; display:flex; flex-direction:column}
  #vPreguntar{flex:1; min-height:0; overflow:auto}
  .split{flex:1; min-height:0; grid-template-columns:minmax(340px, 32%) minmax(0, 1fr); align-items:stretch}
  .list{display:flex; flex-direction:column; min-height:0}
  .rows{flex:1; min-height:0; max-height:none}
  .read{min-height:0; overflow:auto}
  .read > *{flex-shrink:0}
}
@media (min-width:1700px){ .split{grid-template-columns:minmax(420px, 28%) minmax(0, 1fr)} }
/* iPhone: con letra de menos de 16 px acerca la página al escribir. */
@media (max-width:1024px), (pointer:coarse){ input, textarea, select{font-size:16px!important} }
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

<body>
<div id="bloqueo" class="lock">
  <div class="lockbox" id="abriendo" hidden><h1>Bandeja Zoho</h1><p class="muted" style="margin:0">Abriendo tu correo…</p></div>
  <form id="formClave" class="lockbox">
    <h1>Bandeja Zoho</h1>
    <p class="muted small" style="margin:0">Tus correos están cifrados. Ingresa tu contraseña para verlos.</p>
    <input id="clave" type="password" autocomplete="current-password" placeholder="Contraseña" required>
    <label class="small muted"><input type="checkbox" id="recordar" checked> Recordar en este dispositivo (no volver a pedirla)</label>
    <p id="errClave" class="small" style="color:var(--alta);min-height:18px;margin:0"></p>
    <button class="btn" type="submit">Abrir</button>

</div>

<div class="avance" id="panelAvance" hidden></div>
<div class="avance od" id="panelOD" hidden></div>
<div class="pantalla" id="pantalla" hidden role="dialog" aria-modal="true" aria-label="Vista del archivo">
  <div class="pbar"><button class="pbtn" data-cerrarvisor aria-label="Cerrar">✕</button><strong class="pnombre" id="pNombre"></strong>
    <div class="pzoom"><button class="pbtn" data-zoomv="-1" aria-label="Alejar">−</button><span id="pZoom">100%</span><button class="pbtn" data-zoomv="1" aria-label="Acercar">+</button></div>
    <button class="pbtn" data-bajarvisor aria-label="Descargar">⬇</button></div>
  <div class="ptabs" id="pTabs" hidden></div>

</div>

  <header>

    <div class="casillas" id="casillas" hidden><span class="lbl">Casilla:</span><div class="seg" id="seg"></div></div>
    <nav class="tabs" role="tablist" aria-label="Vistas">

    <div class="acciones">
      <div class="sinc"><button class="chip" id="buscarAhora" title="Buscar correos nuevos en Zoho">🔄<span class="pc"> Buscar ahora</span></button><span class="small muted" id="sincTxt"></span></div>
      <button class="btn" id="nuevo" data-nuevo>✉️<span class="pc"> Nuevo correo</span><span class="movil"> Nuevo</span></button>
      <button class="chip" id="avisos" hidden title="Activar burbuja y avisos">🔔<span class="pc"> Activar burbuja y avisos</span></button>
      <button class="chip" id="verOD" title="Facturas de la valija a OneDrive">☁️<span class="pc"> OneDrive</span><span id="odNum"></span></button>
      <button class="chip" id="verAvance" title="Avance: correos indexados y analizados por la IA">📊<span class="pc"> Avance</span></button>
      <button class="chip" id="salir" title="Olvidar la contraseña en este dispositivo"><span class="pc">Cerrar sesión</span><span class="movil">Salir</span></button>

  <section id="vCorreos">
    <div class="toolbar" style="margin-bottom:10px">

      <select id="campoBusca" class="campo-busca" aria-label="Buscar en">
        <option value="todo">Todo</option><option value="asunto">Asunto</option><option value="de">De</option>
        <option value="para">Para / Cc</option><option value="texto">Texto</option></select>
      <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="busca" type="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Buscar en correos y adjuntos: nombre, factura, monto, RUT…" aria-label="Buscar"><button type="button" class="limpiar-busca" id="limpiarBusca" hidden aria-label="Borrar la búsqueda" title="Borrar la búsqueda">✕</button></label>

      <p class="small muted" id="micTxt" hidden></p>

      <div class="qa" id="qa"></div>

<script>
const CAJA = /*__DATOS__*/null;
const VERSION_PAGINA = /*__VERSION__*/"";
if (matchMedia("(max-width:600px)").matches) document.addEventListener("DOMContentLoaded", () => { const b = document.getElementById("busca"); if (b) b.placeholder = "Buscar…"; });   // commit de la plantilla con que se publicó esta página
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const hoy = new Date();
const fmtL = ms => { const d = new Date(+ms); return d.toDateString() === hoy.toDateString() ? d.toLocaleTimeString("es-CL", {hour:"2-digit", minute:"2-digit"}) : d.toLocaleDateString("es-CL", {day:"2-digit", month:"short"}); };
const fmtF = ms => new Date(+ms).toLocaleString("es-CL", {weekday:"short", day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit"});
const hoyISO = () => new Date().toLocaleDateString("sv-SE");
const ss = { get(k){ try { return localStorage.getItem(k) || sessionStorage.getItem(k); } catch(e){ return null; } },
             set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
             del(k){ try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch(e){} } };

let D = null, MSGS = [], HILOS = {}, CUENTAS = [];
let carpeta = "entrada";   // entrada | enviados (como las carpetas de Zoho)
let abierto = null, busca = "", filtro = "todos", cuentaSel = "", limite = 150, ctxHilo = null;
let CLAVE = "", borrador = null;
const LEIDOS = new Set((() => { try { return JSON.parse(localStorage.getItem("correo_leidos") || "[]"); } catch(e) { return []; } })());
const noLeido = m => NL[m.id] ? true : (m.no_leido && !LEIDOS.has(m.id));
function marcarLeido(id){
  if (NL[id]) { delete NL[id]; guardarPend(); }
  if (!LEIDOS.has(id)) { LEIDOS.add(id); try { localStorage.setItem("correo_leidos", JSON.stringify([...LEIDOS].slice(-3000))); } catch(e){} }
  if (!PEND[id]) { PEND[id] = [Date.now(), 0]; guardarPend(); programarLeidos(6000); }
}
// Leídos en línea: lo que abres aquí se marca leído en Zoho (y así en el celular y en el computador).
// PEND = {id: [cuándo lo abriste, cuándo se pidió marcarlo]}. Se reintenta hasta que Zoho lo confirme.
// NL = correos que marcaste como NO leídos: {id: [cuándo, cuándo se pidió a Zoho]}.
const NL = (() => { try { return JSON.parse(localStorage.getItem("correo_pend_noleidos") || "{}") || {}; } catch(e) { return {}; } })();
function marcarNoLeido(id){
  LEIDOS.delete(id); delete PEND[id]; NL[id] = [Date.now(), 0];
  try { localStorage.setItem("correo_leidos", JSON.stringify([...LEIDOS].slice(-3000))); } catch(e) {}
  guardarPend(); programarLeidos(3000);
}
const PEND = (() => { try { const p = JSON.parse(localStorage.getItem("correo_pend_leidos") || "null"); if (p) return p; } catch(e) {}
  const p = {}; for (const id of LEIDOS) p[id] = [Date.now(), 0]; return p; })();
function guardarPend(){ try { localStorage.setItem("correo_pend_leidos", JSON.stringify(PEND)); localStorage.setItem("correo_pend_noleidos", JSON.stringify(NL)); } catch(e) {} }
/* ---------- Estrellas (seguimiento): se guardan en los datos, así se ven igual en el celular y en el computador ---------- */
const ESTR = (() => { try { return JSON.parse(localStorage.getItem("correo_estrellas_pend") || "{}") || {}; } catch(e) { return {}; } })();
function esEstrella(id){
  const l = ESTR[id], srv = !!((D && D.estrellas) || {})[id];
  if (l && (l[0] === srv || Date.now() - l[1] > 15 * 60000)) { delete ESTR[id]; try { localStorage.setItem("correo_estrellas_pend", JSON.stringify(ESTR)); } catch(e) {} return srv; }
  return l ? l[0] : srv;
}
function estrellados(){ const ids = new Set(Object.keys((D && D.estrellas) || {})); for (const [id, [on]] of Object.entries(ESTR)) on ? ids.add(id) : ids.delete(id); return [...ids].filter(esEstrella); }
async function alternarEstrella(id){
  const on = !esEstrella(id), m = MSGS.find(x => x.id === id) || HISTORIAL.porId[id];
  ESTR[id] = [on, Date.now()]; try { localStorage.setItem("correo_estrellas_pend", JSON.stringify(ESTR)); } catch(e) {}
  if (m) ESTR_SNAP[id] = m;
  pintarFiltros(); pintarLista(); pintarCorreo();
  const snap = m ? { s: m.asunto, de: m.de, dn: m.de_nombre || "", f: m.fecha, c: m.cuenta || "", ci: m.cuenta_id || "", e: !!m.enviado,
    pa: (m.para || []).slice(0, 3), cf: m.carpeta_nombre || "" } : {};
  try { await pedidoOD({ modo: "estrella", id, on, snap }); }
  catch(e) { delete ESTR[id]; try { localStorage.setItem("correo_estrellas_pend", JSON.stringify(ESTR)); } catch(_) {} aviso("No se pudo guardar la estrella: " + esc(e.message), "mal", 6000); pintarFiltros(); pintarLista(); pintarCorreo(); }
}
const ESTR_SNAP = {};
// Destacados que ya no están en la bandeja (antiguos): se muestran con los datos guardados junto a la estrella.
function destacadoAntiguo(id){
  if (HISTORIAL.porId[id]) return HISTORIAL.porId[id];
  if (ESTR_SNAP[id]) return ESTR_SNAP[id];
  const x = ((D && D.estrellas) || {})[id]; if (!x) return null;
  const h = { id, hist: true, asunto: x.s || "(sin asunto)", de: x.de || "", de_nombre: x.dn || "", fecha: x.f || 0, cuenta: x.c || "", cuenta_id: x.ci || "",
    enviado: !!x.e, para: x.pa || [], cc: [], archivos: [], vista_previa: "", carpeta_nombre: x.cf || "", hilo: "hist-" + id, analisis: null };
  indexar(h); HISTORIAL.porId[id] = h; return h;
}
const estrellaBtn = id => `<span class="estrella${esEstrella(id) ? " on" : ""}" role="button" tabindex="0" data-estrella="${esc(id)}" aria-label="${esEstrella(id) ? "Quitar estrella" : "Destacar con estrella"}" title="${esEstrella(id) ? "Quitar estrella" : "Destacar (seguimiento)"}">${esEstrella(id) ? "★" : "☆"}</span>`;

let tLeidos = null;
function programarLeidos(ms){ clearTimeout(tLeidos); tLeidos = setTimeout(sincLeidos, ms); }
async function sincLeidos(){
  const gh = D && D._envio; if (!gh || !gh.token || !D.mensajes) return;
  const ahora = Date.now(), ids = {}, lote = [];
  for (const [id, [t, e]] of Object.entries(PEND)) {
    const m = D.mensajes[id];
    if (!m || !m.no_leido || ahora - t > 7 * 864e5) { delete PEND[id]; continue; }   // Zoho ya lo tiene leído
    if (ahora - e < 10 * 60000 || !m.cuenta_id || lote.length >= 300) continue;        // pedido hace poco: esperar
    (ids[m.cuenta_id] ||= []).push(id); lote.push(id);
  }
  const ids_no = {}, loteNo = [];
  for (const [id, [t, e]] of Object.entries(NL)) {
    const m = D.mensajes[id];
    if (!m || ahora - t > 7 * 864e5) { delete NL[id]; continue; }
    if (m.no_leido && e && ahora - e > 30000) { delete NL[id]; continue; }      // Zoho ya lo tiene como no leído
    if (ahora - e < 10 * 60000 || !m.cuenta_id) continue;
    (ids_no[m.cuenta_id] ||= []).push(id); loteNo.push(id);
  }
  guardarPend();
  if (!lote.length && !loteNo.length) return;
  try {
    const paquete = await cifrar({ modo: "leidos", ids, ids_no, ts: ahora });
    const r = await fetch(`https://api.github.com/repos/${gh.repo}/actions/workflows/correo_enviar.yml/dispatches`, { method: "POST",
      headers: { "Authorization": "Bearer " + gh.token, "Accept": "application/vnd.github+json" },
      body: JSON.stringify({ ref: "main", inputs: { paquete: JSON.stringify(paquete), id: "leidos-" + Math.random().toString(36).slice(2, 10) } }) });
    if (r.ok) { for (const id of lote) if (PEND[id]) PEND[id][1] = ahora; for (const id of loteNo) if (NL[id]) NL[id][1] = ahora; guardarPend(); }
  } catch(e) {}
}   // borrador: {id, para, cc, asunto, texto, obs, confirmar, estado, clase, ocupado}

/* ---------- descifrar ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let CAJA_ACTUAL = CAJA || {};
// Los últimos datos (cifrados) se guardan en el teléfono: la app abre al tiro con lo último que viste.
const REPO = (() => { const h = location.hostname.split(".")[0], p = location.pathname.split("/").filter(Boolean)[0];
  return location.hostname.endsWith("github.io") && p ? h + "/" + p : "nicolasanavalon/sii-dte"; })();
async function cajaLocal(){ try { const c = await caches.open("correo"); const r = await c.match("caja"); return r ? await r.json() : null; } catch(e) { return null; } }
async function guardarCajaLocal(caja, v){ try { const c = await caches.open("correo"); await c.put("caja", new Response(JSON.stringify(caja)));
  if (v) await c.put("caja-v", new Response(v)); } catch(e) {} }
async function versionLocal(){ try { const r = await (await caches.open("correo")).match("caja-v"); return r ? await r.text() : null; } catch(e) { return null; } }
async function abrir(clave){
  let caja = await cajaLocal();
  if (caja && caja.ct) { try { const d = await abrirCaja(caja, clave); CAJA_ACTUAL = caja; versionActual = await versionLocal(); return d; } catch(e) { if (CAJA) caja = null; else throw e; } }
  if (CAJA && CAJA.ct) { CAJA_ACTUAL = CAJA; return abrirCaja(CAJA, clave); }
  // Primera vez en este teléfono: se descarga (cifrado) desde GitHub.
  const r = await fetch(`https://raw.githubusercontent.com/${REPO}/correo-datos/caja.json?t=${Date.now()}`, {cache: "no-store"});
  if (!r.ok) throw new Error("No pude descargar tus correos (" + r.status + ").");
  caja = await r.json();
  const d = await abrirCaja(caja, clave); CAJA_ACTUAL = caja; guardarCajaLocal(caja); return d;
}
async function abrirCaja(CAJA, clave){
  const pw = await crypto.subtle.importKey("raw", new TextEncoder().encode(clave), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(CAJA.salt), iterations:CAJA.iter, hash:"SHA-256"}, pw, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plano = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(CAJA.iv)}, key, b64(CAJA.ct));
  return JSON.parse(await new Response(new Blob([plano]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
}

function construir(refresco = false){
  MSGS = Object.values(D.mensajes || {}).map(m => ({...m, para: m.para || [], cc: m.cc || [], archivos: m.archivos || [],
    cuenta: m.cuenta || D.cuenta || "", hilo: m.hilo || ("m" + m.id)})).sort((a, b) => b.fecha - a.fecha);
  HILOS = {};
  for (const m of MSGS) (HILOS[m.hilo] ||= []).push(m);
  for (const k in HILOS) HILOS[k].sort((a, b) => a.fecha - b.fecha);
  try { pintarBotonOD(); } catch(e) {}
  agregarLocales();
  CUENTAS = [...new Set(MSGS.map(m => m.cuenta).filter(Boolean))];
  armarAgenda();
  for (const m of MSGS) indexar(m);
  $("#estado").textContent = `${MSGS.length} correos${CUENTAS.length > 1 ? " · " + CUENTAS.length + " casillas" : ""}`;
  $("#hintIA").textContent = D._ia && (D._ia.clave || D._ia.clave_gemini) ? `Responde la IA gratuita (${D._ia.clave_gemini ? "Gemini de Google" + (D._ia.clave ? ", con Groq de respaldo" : "") : "Groq"}) usando tus correos y adjuntos. Puede equivocarse: revisa el correo citado.` : "La IA se activa cuando guardes la clave gratuita de Gemini (GEMINI_API_KEY) o de Groq (GROQ_API_KEY).";
  pintarFiltros(); pintarLista();
  if (!refresco || !abierto || abierto === pendienteAbrir) pintarCorreo();
  if (pendienteAbrir) abrirPendiente();
  programarLeidos(3000);
}

/* ---------- vista Correos ---------- */
function pintarFiltros(){
  const nNoLeidos = MSGS.filter(m => (!cuentaSel || m.cuenta === cuentaSel) && noLeido(m)).length;

const etiqueta = c => ((D && D.etiquetas) || {})[c] || (/gary/i.test(c || "") ? "Gary" : (c || "").split("@")[0]);

const terminos = () => norm(busca).split(/\s+/).filter(Boolean);
let campoBusca = "todo";
// Índices de búsqueda por campo (asunto, de, para/cc, texto) y uno general.
function indexar(m){
  m._as = norm(m.asunto); m._de = norm(m.de + " " + (m.de_nombre || "")); m._pa = norm(m.para.join(" ") + " " + m.cc.join(" "));
  m._tx = norm((m.texto || m.vista_previa || "") + " " + m.archivos.map(a => a.nombre + " " + (a.texto || "")).join(" "));
  m._idx = m._as + " " + m._de + " " + m._pa + " " + m._tx;
}
const campoDe = m => ({asunto: m._as, de: m._de, para: m._pa, texto: m._tx}[campoBusca] ?? m._idx);
function visibles(){
  const terms = terminos();
  if (filtro === "estrella") {     // destacados: de todas las carpetas, también los antiguos
    return estrellados().map(id => MSGS.find(x => x.id === id) || destacadoAntiguo(id))
      .filter(m => m && (!cuentaSel || m.cuenta === cuentaSel) && terms.every(t => campoDe(m).includes(t)))
      .sort((a, b) => b.fecha - a.fecha);
  }
  const propios = MSGS.filter(m => (!cuentaSel || m.cuenta === cuentaSel) &&
    (terms.length || (carpeta === "enviados" ? m.enviado : !m.enviado)) &&     // al buscar: en todas las carpetas
    (filtro === "todos" || (filtro === "noleidos" && noLeido(m)) || (filtro === "adjuntos" && m.archivos.length)) &&
    terms.every(t => campoDe(m).includes(t)));
  if (!terms.length || filtro === "noleidos" || !HISTORIAL.lista) return propios;
  // Al buscar: también los correos antiguos del historial (índice liviano de todas las casillas y carpetas).
  const ya = new Set(MSGS.map(m => m.id));
  const viejos = HISTORIAL.lista.filter(h => !ya.has(h.id) && (!cuentaSel || h.cuenta === cuentaSel) &&
    (filtro !== "adjuntos" || h.adj) && terms.every(t => campoDe(h).includes(t))).slice(0, 300);
  return [...propios, ...viejos];
}

const correosDe = t => (String(t || "").match(/[^\s<>,;"']+@[^\s<>,;"']+/g) || []).map(x => x.toLowerCase());

    HISTORIAL.hilos = {};

      id: e.i, hist: true, cuenta_id: e.a, cuenta: e.c, carpeta: e.f, carpeta_nombre: e.fn, enviado: !!e.e, fecha: e.t,

// Resalta los términos sin importar tildes ni mayúsculas (la normalización mantiene el largo del texto).
function resaltar(texto, terms){
  texto = String(texto || "");
  if (!terms.length) return esc(texto);
  const n = norm(texto), marcas = new Array(texto.length).fill(false);
  for (const t of terms) { if (t.length < 2) continue; let i = n.indexOf(t); while (i >= 0) { for (let k = i; k < i + t.length; k++) marcas[k] = true; i = n.indexOf(t, i + t.length); } }
  let out = "", dentro = false;
  for (let i = 0; i < texto.length; i++) {
    if (marcas[i] && !dentro) { out += "<mark>"; dentro = true; }
    if (!marcas[i] && dentro) { out += "</mark>"; dentro = false; }
    out += esc(texto[i]);
  }
  return out + (dentro ? "</mark>" : "");
}

function fragmento(m, terms){
  if (!terms.length) return esc((m.analisis || {}).resumen || m.vista_previa || (m.texto || "").slice(0, 160));
  const fuentes = [["", m.texto || ""], ...m.archivos.map(a => ["📎 " + a.nombre + ": ", a.texto || ""])];
  for (const [pref, txt] of fuentes) {
    const i = norm(txt).indexOf(terms[0]);
    if (i >= 0) return esc(pref) + "…" + resaltar(txt.slice(Math.max(0, i - 60), i + 140).replace(/\s+/g, " "), terms) + "…";
  }
  return resaltar((m.analisis || {}).resumen || m.vista_previa || "", terms);
}

/* ---------- contenido completo de cada correo (HTML y textos largos): se baja solo al abrirlo ---------- */
const CUERPOS = {};
let _llaveCuerpos = null;
function llaveCuerpos(){
  return _llaveCuerpos ||= (async () => {
    const pw = await crypto.subtle.importKey("raw", new TextEncoder().encode(CLAVE), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(D.sal_cuerpos), iterations: 250000, hash: "SHA-256"}, pw, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  })();
}
async function cargarCuerpo(m){
  if (!m.cuerpo || CUERPOS[m.id] || !D.sal_cuerpos) return;
  CUERPOS[m.id] = "cargando";
  try {
    const r = await fetch(`https://raw.githubusercontent.com/${D._repo || REPO}/correo-adjuntos/adj/${m.cuerpo}.bin`);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const caja = new Uint8Array(await r.arrayBuffer());
    const plano = await crypto.subtle.decrypt({name: "AES-GCM", iv: caja.slice(2, 14)}, await llaveCuerpos(), caja.slice(14));
    const c = JSON.parse(await new Response(new Blob([plano]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
    CUERPOS[m.id] = c;
    for (const x of MSGS.filter(y => y.id === m.id)) {
      if (c.html) x.html = c.html;
      if (c.texto) x.texto = c.texto;
      (c.archivos || []).forEach((t, i) => { if (t && x.archivos[i]) x.archivos[i].texto = t; });
      indexar(x);
    }
  } catch(e) { CUERPOS[m.id] = "error"; }
  if (abierto === m.id) pintarCorreo();
}

async function cifrar(obj){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const pw = await crypto.subtle.importKey("raw", new TextEncoder().encode(CLAVE), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:250000, hash:"SHA-256"}, pw, {name:"AES-GCM", length:256}, false, ["encrypt"]);
  const gz = new Uint8Array(await new Response(new Blob([JSON.stringify(obj)]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer());
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, gz));
  const b = u => { let t = ""; for (let i = 0; i < u.length; i += 8192) t += String.fromCharCode(...u.subarray(i, i + 8192)); return btoa(t); };
  return {v:1, iter:250000, salt:b(salt), iv:b(iv), ct:b(ct)};
}

function md(t){
  const lineas = esc(t).split("\n"); let html = "", lista = false;
  for (let l of lineas) {
    l = l.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    const m = l.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)/);
    if (m) { if (!lista) { html += "<ul>"; lista = true; } html += `<li>${m[1]}</li>`; continue; }
    if (lista) { html += "</ul>"; lista = false; }
    if (l.trim()) html += `<p>${l.replace(/^#+\s*/, "")}</p>`;
  }
  return html + (lista ? "</ul>" : "");
}

function textoHilo(ms, limite){
  let out = "";
  for (const m of [...ms].reverse()) {
    let p = `--- CORREO del ${fmtF(m.fecha)} | ${m.enviado ? "ENVIADO por Nicolás" : "RECIBIDO"} | De: ${m.de_nombre || ""} <${m.de}> | Para: ${m.para.join(", ")}${m.cc.length ? " | Cc: " + m.cc.join(", ") : ""} | Asunto: ${m.asunto}\n${m.texto || m.vista_previa || ""}\n`;
    for (const a of m.archivos) p += `[ADJUNTO ${a.nombre}]\n${a.texto && !String(a.texto).startsWith("(") ? a.texto : "(sin texto legible)"}\n[FIN ADJUNTO]\n`;
    if (out.length + p.length > limite) { out += p.slice(0, Math.max(0, limite - out.length)) + "\n[…recortado]\n"; break; }
    out += p;
  }
  return out;
}

const VACIAS = new Set("que cual cuales cuanto cuanta cuando como donde para por los las del con una uno unos unas tengo debo hay sobre este esta ese esa algo dijo dice tiene".split(" "));
function contextoGeneral(q){
  const terms = norm(q).split(/[^a-z0-9ñ]+/).filter(t => t.length > 2 && !VACIAS.has(t));
  const puntaje = {}, base = MSGS.filter(m => !cuentaSel || m.cuenta === cuentaSel);
  for (const m of base) {
    let s = 0; for (const t of terms) { if (norm(m.asunto + " " + m.de_nombre + " " + m.de).includes(t)) s += 4; if (m._idx.includes(t)) s += 2; }
    if (s) puntaje[m.hilo] = Math.max(puntaje[m.hilo] || 0, s + m.fecha / 1e14);
  }
  const mejores = Object.entries(puntaje).sort((a, b) => b[1] - a[1]).slice(0, 6).map(x => x[0]);
  let texto = "";
  for (const hid of mejores) {
    const ms = HILOS[hid], h = (D.hilos || {})[hid] || {}, ult = ms.at(-1);
    let bloque = `\n### Conversación "${ult.asunto}" con ${ult.de_nombre || ult.contacto} (último correo ${fmtF(ult.fecha)})\n${h.resumen ? "Resumen: " + h.resumen + "\n" : ""}${(h.puntos_clave || []).length ? "Puntos clave: " + h.puntos_clave.join("; ") + "\n" : ""}`;
    for (const m of [...ms].reverse()) {
      const fuentes = [[`correo del ${fmtF(m.fecha)} de ${m.de_nombre || m.de}`, m.texto || ""], ...m.archivos.map(a => [`adjunto ${a.nombre} (correo del ${fmtF(m.fecha)})`, a.texto || ""])];
      for (const [donde, txt] of fuentes) { const n = norm(txt);
        for (const t of terms) { const i = n.indexOf(t); if (i >= 0) { bloque += `(${donde}) …${txt.slice(Math.max(0, i - 400), i + 600)}…\n`; break; } } }
      if (bloque.length > 4500) break;
    }
    if (texto.length + bloque.length > 10000) break;
    texto += bloque;
  }
  // Correos antiguos (historial analizado): los que mejor coinciden con la pregunta.
  if (HISTORIAL.lista && terms.length && texto.length < 9000) {
    const ya = new Set(MSGS.map(m => m.id)), cand = [];
    for (const h of HISTORIAL.lista) {
      if (ya.has(h.id) || (cuentaSel && h.cuenta !== cuentaSel)) continue;
      let sc = 0; for (const t of terms) { if ((h._as + " " + h._de).includes(t)) sc += 4; if (h._idx.includes(t)) sc += 2; }
      if (sc) cand.push([sc + h.fecha / 1e14, h]);
    }
    cand.sort((a, b) => b[0] - a[0]);
    const vistos = new Set();
    for (const [, h] of cand.slice(0, 25)) {
      const hl = (HISTORIAL.hilos || {})[h.hilo_arch];
      let b = `\n### Correo antiguo "${h.asunto}" ${h.enviado ? "enviado a " + (h.para[0] || "") : "de " + (h.de_nombre || h.de)} (${fmtF(h.fecha)})\n` +
        (h.analisis ? "Resumen: " + h.analisis.resumen + "\n" : "") + (h.texto ? "Texto: " + h.texto.slice(0, 500) + "\n" : "");
      if (hl && !vistos.has(h.hilo_arch)) { vistos.add(h.hilo_arch); b += `Resumen de la conversación: ${hl.resumen}\n${(hl.puntos_clave || []).length ? "Puntos clave: " + hl.puntos_clave.join("; ") + "\n" : ""}`; }
      if (texto.length + b.length > 13000) break;
      texto += b;
    }
  }
  const indice = base.slice(0, 60).map(m => `- ${fmtL(m.fecha)} | ${m.enviado ? "enviado a " + (m.para[0] || "") : (m.de_nombre || m.de)} | ${m.asunto}`).join("\n");
  return `ÚLTIMOS CORREOS (índice):\n${indice.slice(0, 3000)}\n\nCORREOS RELACIONADOS CON LA PREGUNTA:${texto || "\n(ninguno coincide con las palabras de la pregunta)"}`;
}

const MODELOS_QA = ["openai/gpt-oss-120b", "llama-3.3-70b-versatile", "openai/gpt-oss-20b", "llama-3.1-8b-instant"];
// IA gratuita: Gemini de Google (principal) y Groq (respaldo). Primero los modelos reservados para la página.
const SIN_PENSAR = new Set();   // modelos de Gemini que no aceptan "thinkingConfig"
async function llamarModelo(ia, modelo, sistema, usuario, json, signal){
  if (modelo.startsWith("gemini")) {
    const pedir = pensar => fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent?key=${encodeURIComponent(ia.clave_gemini)}`, { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ systemInstruction: { parts: [{ text: sistema }] }, contents: [{ role: "user", parts: [{ text: usuario }] }],
        generationConfig: Object.assign({ temperature: 0.2, maxOutputTokens: 4096 }, json ? { responseMimeType: "application/json" } : {},
          pensar ? { thinkingConfig: { thinkingLevel: "low" } } : {}) }), signal }).catch(() => null);
    let r = await pedir(!SIN_PENSAR.has(modelo));          // pensar poco = responder rápido
    if (r && r.status === 400 && !SIN_PENSAR.has(modelo)) { SIN_PENSAR.add(modelo); r = await pedir(false); }
    if (!r || !r.ok) return { r };
    const j = await r.json(), partes = (((j.candidates || [])[0] || {}).content || {}).parts || [];
    return { r, texto: partes.filter(p => !p.thought).map(p => p.text || "").join("") };
  }
  const r = await fetch("https://api.groq.com/openai/v1/chat/completions", { method: "POST",
    headers: { "Authorization": "Bearer " + ia.clave, "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({ model: modelo, temperature: 0.2, max_tokens: 1500,
      messages: [{ role: "system", content: sistema }, { role: "user", content: usuario }] },
      modelo.includes("gpt-oss") ? { reasoning_effort: "low" } : {}, json ? { response_format: { type: "json_object" } } : {})), signal }).catch(() => null);
  if (!r || !r.ok) return { r };
  const j = await r.json();
  return { r, texto: j.choices[0].message.content || "" };
}
// Modelos que no respondieron a tiempo: se saltan 30 minutos (así la siguiente pregunta no espera de nuevo).
const LENTOS = (() => { try { return JSON.parse(localStorage.getItem("correo_ia_lentos") || "{}"); } catch(e) { return {}; } })();
const marcarLento = m => { LENTOS[m] = Date.now() + 30 * 60000; try { localStorage.setItem("correo_ia_lentos", JSON.stringify(LENTOS)); } catch(e) {} };
const ESPERA_IA = 20000;    // máximo por modelo; si no responde, se pasa al siguiente

async function groq(sistema, usuario, json = false, avance = () => {}, rapido = false){
  const ia = D._ia;
  if (!ia || !(ia.clave || ia.clave_gemini)) throw new Error("La IA todavía no está activada (falta la clave gratuita de Gemini o de Groq).");
  const cuenta = (ia.modelos && ia.modelos.length ? ia.modelos : MODELOS_QA)
    .filter(m => m.startsWith("gemini") ? ia.clave_gemini : ia.clave);
  // Orden: los reservados rápidos (Gemini flash más nuevo, mejor de Groq), otros flash, y los "pro" (lentos) al final.
  const res = (ia.reservados || []).filter(m => cuenta.includes(m)), pro = m => /pro/.test(m) && m.startsWith("gemini");
  const orden = [ia.modelo, ...res.filter(m => !pro(m)), ...cuenta.filter(m => !pro(m) && !/lite/.test(m)), ...cuenta.filter(m => !pro(m)), ...cuenta]
    .filter((m, i, a) => m && a.indexOf(m) === i);
  // Rápido (mejorar o revisar un borrador): primero Groq, que responde en 1-2 s; después Gemini.
  if (rapido) orden.sort((a, b) => (a.startsWith("gemini") ? 1 : 0) - (b.startsWith("gemini") ? 1 : 0));
  const ahora = Date.now(), modelos = [...orden.filter(m => !(LENTOS[m] > ahora)), ...orden.filter(m => LENTOS[m] > ahora)];
  let error = "La IA no pudo responder.", limite = false;
  for (const modelo of modelos.slice(0, 6)) {
    const nombre = modelo.startsWith("gemini") ? "Gemini" : "Groq", ini = Date.now(), ctl = new AbortController();
    avance(`Pensando con ${nombre}…`);
    const reloj = setInterval(() => avance(`Pensando con ${nombre}… (${Math.round((Date.now() - ini) / 1000)} s)`), 1000);
    const corte = setTimeout(() => ctl.abort(), ESPERA_IA);
    const { r, texto } = await llamarModelo(ia, modelo, sistema, usuario, json, ctl.signal).catch(() => ({ r: null }));
    clearInterval(reloj); clearTimeout(corte);
    if (!r && ctl.signal.aborted) { marcarLento(modelo); error = "La IA tardó demasiado; prueba de nuevo."; avance(`${nombre} tardó mucho, probando otro…`); continue; }
    if (r && r.ok && texto && texto.trim()) return texto.replace(/<think>[\s\S]*?<\/think>/g, "").trim();
    if (r && r.status === 429) {
      const txt = await r.text().catch(() => ""), dia = /per ?day|TPD|RPD/i.test(txt), m = txt.match(/(?:try again|retry) in ([\dhms.]+)/);
      const en = m ? m[1].replace(/\.$/, "").replace(/\.\d+s/, "s").replace(/(\d+)h/, "$1 h ").replace(/(\d+)m(?!s)/, "$1 min ").replace(/(\d+)s/, "$1 s").trim() : "";
      if (!limite || dia) error = dia ? `La IA gratuita llegó a su límite del día${en ? "; vuelve a estar disponible en " + en : ""}.` : "La IA gratuita está ocupada (límite por minuto). Prueba en un minuto.";
      limite = true;
    } else if (!limite) error = !r ? "Sin conexión con la IA." : `La IA no pudo responder (${r.status}).`;
    if (r && ![400, 403, 404, 413, 429, 500, 503].includes(r.status)) break;
  }
  throw new Error(error);
}

/* ---------- dictar la pregunta: se graba la voz y la transcribe Whisper (gratis, de Groq) ---------- */
let grabadora = null, trozosVoz = [], relojMic = null;
function estadoMic(txt, grabando){
  const b = $("#btnMic"); b.classList.toggle("grabando", !!grabando); b.textContent = grabando ? "⏹" : "🎤";
  b.setAttribute("aria-label", grabando ? "Detener y transcribir" : "Dictar la pregunta");
  $("#micTxt").hidden = !txt; $("#micTxt").textContent = txt || "";
}
async function transcribir(blob){
  const ia = D._ia || {};
  if (!ia.clave) throw new Error("Para dictar falta la clave gratuita de Groq.");
  const ext = /mp4|m4a|aac/.test(blob.type) ? "m4a" : /ogg/.test(blob.type) ? "ogg" : "webm";
  let ultimo = "";
  for (const modelo of ["whisper-large-v3-turbo", "whisper-large-v3"]) {
    const f = new FormData();
    f.append("file", blob, "pregunta." + ext); f.append("model", modelo); f.append("language", "es");
    f.append("prompt", "Pregunta sobre correos de Anasep, Platón y Gary: facturas, pagos, montos, proveedores.");
    const r = await fetch("https://api.groq.com/openai/v1/audio/transcriptions", { method: "POST",
      headers: { "Authorization": "Bearer " + ia.clave }, body: f }).catch(() => null);
    if (r && r.ok) return ((await r.json()).text || "").trim();
    ultimo = !r ? "Sin conexión." : r.status === 429 ? "Se alcanzó el límite gratis de dictado por ahora; prueba en un rato." : `No se pudo transcribir (${r.status}).`;
    if (r && r.status !== 404 && r.status !== 400) break;
  }
  throw new Error(ultimo);
}
$("#btnMic").addEventListener("click", async () => {
  if (grabadora && grabadora.state === "recording") { grabadora.stop(); return; }
  if (!navigator.mediaDevices || !window.MediaRecorder) { estadoMic("Este navegador no permite grabar voz. Usa el micrófono del teclado."); return; }
  let flujo;
  try { flujo = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch(e) { estadoMic("Sin permiso para el micrófono. Actívalo en la configuración del navegador para esta página."); return; }
  trozosVoz = [];
  const tipo = ["audio/webm;codecs=opus", "audio/mp4", "audio/webm"].find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t));
  grabadora = new MediaRecorder(flujo, tipo ? { mimeType: tipo } : undefined);
  grabadora.ondataavailable = e => { if (e.data && e.data.size) trozosVoz.push(e.data); };
  grabadora.onstop = async () => {
    clearInterval(relojMic); flujo.getTracks().forEach(t => t.stop());
    const blob = new Blob(trozosVoz, { type: grabadora.mimeType || tipo || "audio/webm" });
    if (blob.size < 1500) { estadoMic("No se escuchó nada. Mantén apretado un poco más."); return; }
    estadoMic("Transcribiendo…"); $("#btnMic").disabled = true;
    try {
      const texto = await transcribir(blob);
      const q = $("#qAsk"); q.value = (q.value.trim() ? q.value.trim() + " " : "") + texto; q.focus();
      estadoMic(texto ? "Revisa el texto y aprieta Preguntar." : "No se entendió; intenta de nuevo.");
      setTimeout(() => { if ($("#micTxt").textContent.startsWith("Revisa")) estadoMic(""); }, 6000);
    } catch(e) { estadoMic(e.message); }
    $("#btnMic").disabled = false;
  };
  grabadora.start();
  const ini = Date.now();
  estadoMic("Escuchando… habla y aprieta ⏹ al terminar (0:00)", true);
  relojMic = setInterval(() => {
    const s = Math.floor((Date.now() - ini) / 1000);
    if (s >= 90) { grabadora.stop(); return; }                 // tope: 1 minuto y medio
    estadoMic(`Escuchando… habla y aprieta ⏹ al terminar (${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")})`, true);
  }, 500);
});

/* ---------- correos nuevos: casi en tiempo real ---------- */
// Un "vigilante" en GitHub revisa Zoho cada minuto y guarda los datos (cifrados) en la rama correo-datos.
// La página la revisa cada 30 segundos y, si hay algo nuevo, lo descarga y lo muestra sin recargar.
var versionActual = null; let buscando = false;
const horaTxt = ms => new Date(ms || Date.now()).toLocaleTimeString("es-CL", {hour: "2-digit", minute: "2-digit"});
function sinc(txt, gira){ $("#sincTxt").innerHTML = esc(txt); $("#buscarAhora").innerHTML = (gira ? '<span class="girando">🔄</span>' : "🔄") + '<span class="pc"> Buscar ahora</span>'; }

async function deDatos(archivo, rama = "correo-datos"){
  const gh = (D && D._envio) || {}, repo = gh.repo || (D && D._repo) || "nicolasanavalon/sii-dte";
  const url = `https://api.github.com/repos/${repo}/contents/${archivo}?ref=${rama}`;
  const h = { "Accept": "application/vnd.github.raw" };
  if (gh.token) h.Authorization = "Bearer " + gh.token;
  // Tope de tiempo: si la red o el navegador dejan la descarga pegada, se corta y se reintenta en la próxima revisión.
  const pedir = () => { const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), archivo === "version.json" ? 20000 : 90000);
    return fetch(url, { headers: h, cache: "no-store", signal: ctl.signal }).finally(() => clearTimeout(t)); };
  let r = await pedir();
  if ((r.status === 401 || r.status === 403) && h.Authorization) { delete h.Authorization; r = await pedir(); }
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
/* ---------- Facturas a OneDrive (las sube el vigilante con rclone; ver onedrive.py) ---------- */
const OD = () => D.onedrive || {};
const odConectado = () => !!OD().drive_id;
const normOD = t => String(t || "").normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toUpperCase().replace(/[^A-Z0-9]/g, "");
let odEsperando = {}, odEnviado = {}, odConectando = 0;
async function pedidoOD(obj){
  const gh = D._envio; if (!gh || !gh.token) throw new Error("Falta el permiso para enviar pedidos.");
  const paquete = await cifrar({ ...obj, ts: Date.now() });
  const r = await fetch(`https://api.github.com/repos/${gh.repo}/actions/workflows/correo_trozo.yml/dispatches`, { method: "POST",
    headers: { "Authorization": "Bearer " + gh.token, "Accept": "application/vnd.github+json" },
    body: JSON.stringify({ ref: "main", inputs: { id: "trozo-ped" + Math.random().toString(36).slice(2, 10) + "-0", datos: JSON.stringify(paquete) } }) });
  if (!r.ok) throw new Error("GitHub no aceptó el pedido (" + r.status + ")");
}
// Proveedores que esperan que digas su carpeta: {clave: {prov, archivos[]}}
function pendientesOD(){
  const o = OD(), mapa = o.mapa || {}, carp = new Set((o.carpetas || []).map(normOD)), out = {};
  for (const x of o.cola || []) {
    if (x.clave in mapa || carp.has(x.clave) || odEnviado[x.clave]) continue;
    (out[x.clave] ||= { prov: x.prov, archivos: [] }).archivos.push(x.nombre);
  }
  return out;
}
function estadoOD(m){
  const h = (OD().hechos || {})[m.id] || [], cola = (OD().cola || []).filter(x => x.id === m.id);
  if (h.length) return `<p class="od-ok">☁️ En OneDrive: ${h.map(x => `${esc(x[0])} → <b>${esc(x[1])}</b>`).join(" · ")}${cola.length ? ` · faltan ${cola.length} (ver ☁️ OneDrive)` : ""}</p>`;
  if (cola.length) return `<p class="od-ok">☁️ ${cola.length} archivo(s) por subir a OneDrive${Object.keys(pendientesOD()).length ? " · dime la carpeta en ☁️ OneDrive" : "…"}</p>`;
  if (odEsperando[m.id] && Date.now() - odEsperando[m.id] < 5 * 60000) return '<p class="od-ok">☁️ Subiendo a OneDrive…</p>';
  return "";
}
function pintarBotonOD(){
  const n = Object.keys(pendientesOD()).length;
  $("#odNum").innerHTML = n ? `<span class="od-num">${n}</span>` : "";
  if (!$("#panelOD").hidden) pintarOD();
}
const COMANDO_OD = `cd /tmp && curl -fsSL -o rclone.zip "https://downloads.rclone.org/rclone-current-osx-$( [ "$(uname -m)" = arm64 ] && echo arm64 || echo amd64 ).zip" && unzip -o -q -j rclone.zip '*/rclone' -d rclone-bin && ./rclone-bin/rclone authorize "onedrive"`;
function pintarOD(){
  const o = OD(), p = $("#panelOD");
  let h = `<h3>☁️ Facturas a OneDrive <button class="chip" data-od="cerrar" aria-label="Cerrar">✕</button></h3>`;
  if (o.error) h += `<p class="small" style="color:var(--alta);margin:0">${esc(o.error)}</p>`;
  if (!odConectado()) {
    h += `<p class="small" style="margin:0">Conecta tu OneDrive una sola vez (en el Mac):</p>
      <ol><li>Abre la app <b>Terminal</b> (⌘ + espacio, escribe "Terminal" y Enter).</li>
      <li>Copia este comando, pégalo en Terminal y aprieta Enter:<pre>${esc(COMANDO_OD)}</pre><button class="chip" data-od="copiar">📋 Copiar comando</button></li>
      <li>Se abre el navegador: entra con tu cuenta de Microsoft y acepta (aparece el nombre <b>rclone</b>, el programa que sube los archivos).</li>
      <li>Vuelve a Terminal: copia todo el texto que aparece entre <b>---&gt;</b> y <b>&lt;---End paste</b> (empieza con <code>{"access_token"</code>) y pégalo aquí:</li></ol>
      <textarea id="odToken" placeholder='{"access_token":"…","token_type":"Bearer",…}'></textarea>
      <button class="btn" data-od="conectar" ${odConectando && Date.now() - odConectando < 4 * 60000 ? "disabled" : ""}>${odConectando && Date.now() - odConectando < 4 * 60000 ? "Conectando… (1 a 2 minutos)" : "Conectar OneDrive"}</button>
      <p class="muted small" style="margin:0">Se guarda cifrado con tu contraseña. Puedes cerrar Terminal después.</p>`;
    p.innerHTML = h; return;
  }
  const pend = pendientesOD(), carpetas = o.carpetas || [];
  h += `<p class="small" style="margin:0">✓ Conectado. Las facturas de la <b>valija</b> se suben solas a <b>${esc(o.base || "Anasep 2/Facturas")}</b>/<i>proveedor</i>.</p>`;
  const claves = Object.keys(pend);
  if (claves.length) {
    h += `<p class="small" style="margin:0"><b>¿En qué carpeta va cada proveedor?</b> Te pregunto solo la primera vez.</p>`;
    for (const k of claves) {
      const x = pend[k], sug = carpetas.filter(c => { const n = normOD(c); return n.length >= 3 && (k.startsWith(n) || n.startsWith(k) || k.includes(n)); });
      h += `<div class="prov"><strong>${esc(x.prov)}</strong><span class="muted small">${x.archivos.map(esc).join(" · ")}</span>
        <select data-clave="${esc(k)}">${sug.map(c => `<option value="c:${esc(c)}">${esc(c)} (sugerida)</option>`).join("")}
          <option value="n:${esc(x.prov.toUpperCase())}">➕ Crear carpeta nueva: ${esc(x.prov.toUpperCase())}</option>
          <optgroup label="Todas las carpetas">${carpetas.map(c => `<option value="c:${esc(c)}">${esc(c)}</option>`).join("")}</optgroup>
          <option value="x:">🚫 No subir nunca este proveedor</option></select>
        <button class="btn" data-od="guardar" data-k="${esc(k)}">Guardar</button></div>`;
    }
  } else h += `<p class="muted small" style="margin:0">No hay facturas esperando carpeta.${(o.cola || []).length ? ` Subiendo ${(o.cola || []).length}…` : ""}</p>`;
  const ultimas = Object.values(o.hechos || {}).flat().sort((a, b) => b[2] - a[2]).slice(0, 12);
  if (ultimas.length) h += `<div class="small"><b>Últimas subidas</b><br>${ultimas.map(x => `${esc(x[0])} → <b>${esc(x[1])}</b> <span class="muted">${fmtF(x[2])}</span>`).join("<br>")}</div>`;
  const mapa = Object.entries(o.mapa || {});
  if (mapa.length) h += `<details class="small"><summary>Proveedores ya ubicados (${mapa.length})</summary>${mapa.map(([k, c]) => `${esc(k)} → ${c ? esc(c) : "🚫 no se sube"} <button class="chip" data-od="olvidar" data-k="${esc(k)}">cambiar</button>`).join("<br>")}</details>`;
  h += `<button class="chip" data-od="desconectar" style="align-self:flex-start">Desconectar OneDrive</button>`;
  p.innerHTML = h;
}
async function accionOD(a, t){
  try {
    if (a === "cerrar") { $("#panelOD").hidden = true; return; }
    if (a === "copiar") { await navigator.clipboard.writeText(COMANDO_OD); aviso("📋 Comando copiado. Pégalo en Terminal.", "bien", 4000); return; }
    if (a === "conectar") {
      const texto = $("#odToken").value.trim();
      if (!/access_token/.test(texto)) { aviso("Pega el texto completo que empieza con {\"access_token\"…", "mal", 6000); return; }
      await pedidoOD({ modo: "onedrive_conectar", texto }); odConectando = Date.now(); pintarOD();
      aviso("☁️ Conectando OneDrive: en 1 o 2 minutos queda listo.", "bien", 6000); return;
    }
    if (a === "guardar") {
      const k = t.dataset.k, v = $(`#panelOD select[data-clave="${k}"]`).value, carpeta = v.slice(2);
      await pedidoOD({ modo: "onedrive_carpeta", clave: k, carpeta: v[0] === "x" ? "" : carpeta });
      odEnviado[k] = carpeta || "🚫"; pintarBotonOD();
      aviso(v[0] === "x" ? "Listo: ese proveedor no se sube." : `☁️ Listo: se sube a "${esc(carpeta)}" y la próxima vez va sola.`, "bien", 5000); return;
    }
    if (a === "olvidar") { if (!confirm("¿Volver a preguntar la carpeta de este proveedor la próxima vez?")) return;
      await pedidoOD({ modo: "onedrive_carpeta", clave: t.dataset.k, carpeta: null, olvidar: true }); aviso("Listo: te preguntaré de nuevo.", "bien", 4000); return; }
    if (a === "desconectar") { if (!confirm("¿Desconectar OneDrive? Las facturas dejarán de subirse.")) return;
      await pedidoOD({ modo: "onedrive_desconectar" }); aviso("OneDrive se desconecta en 1 o 2 minutos.", "bien", 5000); }
  } catch (e) { aviso(esc(e.message), "mal", 8000); }
}
$("#verOD").addEventListener("click", () => { const p = $("#panelOD"); p.hidden = !p.hidden; $("#panelAvance").hidden = true; if (!p.hidden) pintarOD(); });

let AVANCE = null, avanceCaja = "", avanceRevisado = 0;
async function leerAvance(v){
  if (!v || !v.a || JSON.stringify(v.a) === avanceCaja) return;
  try { AVANCE = await abrirCaja(v.a, CLAVE); avanceCaja = JSON.stringify(v.a); if (!$("#panelAvance").hidden) pintarAvance(); } catch(e) {}
}
const num = n => Number(n || 0).toLocaleString("es-CL");
function pintarAvance(){
  const p = $("#panelAvance");
  const filas = AVANCE && AVANCE.cuentas || [];
  p.innerHTML = `<h3>📊 Avance del análisis <button class="chip" data-cerraravance aria-label="Cerrar">✕</button></h3>
    ${filas.length ? filas.map(c => `<div class="fila-av"><strong>${esc(c.n)}</strong>
      <span>Analizados por la IA: <b>${c.pct}%</b> <span class="muted">(${num(c.analizados)} de ${num(c.total)})</span></span>
      <div class="barra2"><i style="width:${Math.min(100, c.pct)}%"></i></div>
      <span class="muted small">En el índice para buscar: ${c.pct_indice}% (${num(c.conocidos)} de ${num(c.total)})</span>
      <div class="barra2 idx"><i style="width:${Math.min(100, c.pct_indice)}%"></i></div></div>`).join("")
    : '<p class="muted small" style="margin:0">El vigilante está calculando el avance; vuelve a abrir esto en un par de minutos.</p>'}
    <p class="muted small" style="margin:0">Incluye todos los correos, desde el más antiguo, recibidos y enviados. La IA gratuita tiene un límite diario: el análisis avanza solo, de a poco${AVANCE && AVANCE.t ? " (actualizado " + horaTxt(AVANCE.t) + ")" : ""}</p>`;
}
$("#verAvance").addEventListener("click", () => { const p = $("#panelAvance"); p.hidden = !p.hidden;
  if (!p.hidden) { pintarAvance(); deDatos("arch_version.json", "correo-archivo").then(leerAvance).catch(() => {}); } });

async function revisarZoho(manual){
  if (!D) return;
  if (buscando && Date.now() - buscando < 120000) return;       // si una revisión quedó pegada, a los 2 min se ignora
  buscando = Date.now();
  if (manual) sinc("Revisando…", true);
  try {
    const v = await deDatos("version.json");
    if (Date.now() - avanceRevisado > 120000) { avanceRevisado = Date.now(); deDatos("arch_version.json", "correo-archivo").then(leerAvance).catch(() => {}); }
    let n = 0;
    if (v.v && v.v !== versionActual) {
      const caja = await deDatos("caja.json");
      if (caja && caja.ct && caja.ct !== CAJA_ACTUAL.ct) {
        const antes = new Set(MSGS.map(m => m.id));
        const nuevoD = await abrirCaja(caja, CLAVE);
        CAJA_ACTUAL = caja; leerBorrador(); D = nuevoD; construir(true); prepararAvisos(); guardarCajaLocal(caja, v.v);
        n = MSGS.filter(m => !antes.has(m.id) && !m.local).length;
      }
      versionActual = v.v; guardarCajaLocal(CAJA_ACTUAL, v.v);
    }
    const atraso = Date.now() - (v.ms || 0);
    sinc(n ? `${n} correo${n > 1 ? "s" : ""} nuevo${n > 1 ? "s" : ""} · ${horaTxt()}`
           : atraso < 5 * 60000 ? `Al día · revisado ${horaTxt(v.ms)}` : `⚠️ Revisado ${horaTxt(v.ms)}`);
  } catch(e) { sinc(`⚠️ Sin conexión (${e.message}); reintento en 30 s`); }
  buscando = false;
}
$("#buscarAhora").addEventListener("click", () => { buscando = false; revisarZoho(true); });

// Página nueva publicada (cambios de diseño o funciones): se recarga sola, sin esperar que el celular olvide la antigua.
let ultimaVersionVista = 0;
async function revisarVersionPagina(){
  if (!VERSION_PAGINA || !D || Date.now() - ultimaVersionVista < 5 * 60000) return;
  ultimaVersionVista = Date.now();
  try {
    const r = await fetch(`pagina.json?t=${Date.now()}`, {cache: "no-store"});
    const sha = r.ok ? (await r.json()).v : "";
    if (!sha || sha === VERSION_PAGINA) return;
    try { if (sessionStorage.getItem("correo_recarga") === sha) return; sessionStorage.setItem("correo_recarga", sha); } catch(e) {}   // una sola vez por versión
    leerBorrador();
    if (borrador || (document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName))) {
      aviso(`Hay una versión nueva de la página. <button class="btn sec" onclick="location.replace(location.pathname + '?v=${sha.slice(0, 10)}')">Actualizar</button>`, "", 0);
    } else location.replace(location.pathname + "?v=" + sha.slice(0, 10));
  } catch(e) {}
}
// Revisa cada 30 s con la página a la vista y cada minuto si está de fondo (otra pestaña o ventana), así al
// volver ya está al día. Además revisa al tiro al volver a la pestaña, a la ventana o a la app.
let ultimaRevision = 0;
setInterval(() => {
  if (!D) return;
  const visible = document.visibilityState === "visible";
  if (visible || Date.now() - ultimaRevision > 55000) { ultimaRevision = Date.now(); revisarZoho(false); }
  if (visible) revisarVersionPagina();
}, 30000);
const alVolver = () => { if (D && document.visibilityState === "visible" && Date.now() - ultimaRevision > 5000) { ultimaRevision = Date.now(); buscando = false; revisarZoho(false); revisarVersionPagina(); } };
document.addEventListener("visibilitychange", alVolver);
window.addEventListener("focus", alVolver);
window.addEventListener("pageshow", alVolver);
window.addEventListener("online", alVolver);

/* ---------- entrar ---------- */
// Al tocar un aviso del iPhone se abre ese correo (si aún no llega a la app, apenas llegue).
let pendienteAbrir = decodeURIComponent((location.hash.match(/#m=([^&]+)/) || [])[1] || "") || null;
function abrirPendiente(){
  if (!pendienteAbrir || !D) return;
  const m = MSGS.find(x => x.id === pendienteAbrir);
  abierto = pendienteAbrir; irA("correos");
  if (m) { carpeta = m.enviado ? "enviados" : "entrada"; marcarLeido(m.id); pendienteAbrir = null; history.replaceState(null, "", location.pathname + location.search); }
  pintarFiltros(); pintarLista(); pintarCorreo(); if (innerWidth <= 860) scrollTo(0, 0);
}
if ("serviceWorker" in navigator) navigator.serviceWorker.addEventListener("message", ev => {
  if (ev.data && ev.data.abrir) { pendienteAbrir = String(ev.data.abrir); abrirPendiente(); buscando = false; revisarZoho(true); }
});

async function entrar(clave, recordar){
  D = await abrir(clave); CLAVE = clave;
  if (recordar) ss.set("correo_clave", clave);
  $("#bloqueo").hidden = true; $("#appwrap").hidden = false;
  construir(); irA("correos"); abrirPendiente();
  revisarZoho(false);
  prepararAvisos();
}
$("#salir").addEventListener("click", () => { ss.del("correo_clave"); location.reload(); });
$("#formClave").addEventListener("submit", async ev => {
  ev.preventDefault(); const err = $("#errClave"); err.textContent = "Abriendo…";
  try { await entrar($("#clave").value, $("#recordar").checked); } catch(e) { err.textContent = "Contraseña incorrecta."; }
});
(async () => {
  const g = ss.get("correo_clave");
  if (g) {            // contraseña recordada: en vez del formulario, "Abriendo…"
    $("#formClave").hidden = true; $("#abriendo").hidden = false;
    try { await entrar(g, false); } catch(e) { $("#formClave").hidden = false; $("#abriendo").hidden = true; $("#errClave").textContent = e.message && !/decrypt|operation/i.test(e.message) ? e.message : ""; }
  }
})();
</script>
