<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Bandeja Zoho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: bandeja tipo correo (lista | correo abierto) + vista de preguntas a la IA. Una columna en el teléfono. */
:root{
  --bg:#ffffff; --panel:#ffffff; --ink:#151a24; --muted:#5d6676; --line:#dfe3ea; --soft:#f1f3f7;
  --accent:#2747b8; --accent-ink:#ffffff; --accent-soft:#e6ebfa; --mark:#fff1a8;
  --alta:#b23a1c; --alta-soft:#fbe8e1; --ok:#1f7a55; --ok-soft:#e1f2ea;
  --f-display:"Instrument Sans","Inter",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:10px; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font:15px/1.5 var(--f-body); padding-top:env(safe-area-inset-top,0px)}
button,input{font:inherit; color:inherit}
a{color:var(--accent)}
mark{background:var(--mark); color:inherit; border-radius:2px; padding:0 1px}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:13px}
h1{font:600 21px/1.2 var(--f-display); margin:0; letter-spacing:-.01em}
h2{font:600 19px/1.3 var(--f-display); margin:0; text-wrap:balance; overflow-wrap:anywhere}
h3{font:600 12.5px/1.3 var(--f-display); margin:0; text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}

.lock{min-height:100vh; display:grid; place-items:center; padding:16px}
.lockbox{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:28px; width:100%; max-width:360px; display:flex; flex-direction:column; gap:12px}
.lockbox input[type=password]{padding:11px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg)}

.app{max-width:1320px; margin:0 auto; padding-block:14px 28px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); display:flex; flex-direction:column; gap:12px}
header{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px 18px}
.tabs{display:flex; gap:4px; background:var(--soft); padding:4px; border-radius:999px}
.tab{border:0; background:none; padding:7px 18px; border-radius:999px; cursor:pointer; color:var(--muted); font-weight:500}
.tab[aria-selected="true"]{background:var(--panel); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn{border:0; background:var(--accent); color:var(--accent-ink); padding:10px 16px; border-radius:8px; cursor:pointer; font-weight:600; white-space:nowrap}
.btn:disabled{opacity:.55; cursor:default}
.chip{border:1px solid var(--line); background:var(--panel); border-radius:999px; padding:4px 11px; font-size:13px; cursor:pointer; color:var(--muted); white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}

/* Correos */
.toolbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.search{flex:1 1 320px; min-width:0; position:relative}
.search input{width:100%; padding:11px 14px 11px 38px; border:1px solid var(--line); border-radius:10px; background:var(--panel)}
.search svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted)}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.split{display:grid; grid-template-columns:minmax(300px, 420px) minmax(0, 1fr); gap:12px; align-items:start}
.list{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.count{padding:8px 14px; border-bottom:1px solid var(--line); font-size:12.5px; color:var(--muted)}
.rows{max-height:calc(100vh - 210px); overflow:auto}
.row{display:block; width:100%; text-align:left; border:0; border-top:1px solid var(--line); background:none; padding:10px 14px; cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--soft)}
.row[aria-current="true"]{background:var(--accent-soft)}
.row.nl{position:relative; background:color-mix(in srgb, var(--accent-soft) 45%, var(--panel))}
.row.nl::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent)}
.row.nl .who, .row.nl .subj{font-weight:700; color:var(--ink)}
.row.nl .who::before{content:""; display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--accent); margin-right:7px; vertical-align:1px}
.r1{display:flex; justify-content:space-between; gap:8px; align-items:baseline}
.who{font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.when{font-size:12px; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums}
.subj{font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.snip{font-size:12.5px; color:var(--muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere}
.tags{display:flex; gap:4px; flex-wrap:wrap; margin-top:3px}
.tag{font-size:11px; padding:0 7px; border-radius:999px; background:var(--soft); color:var(--muted); white-space:nowrap}
.tag.acc{background:var(--accent-soft); color:var(--accent)} .tag.ok{background:var(--ok-soft); color:var(--ok)} .tag.alta{background:var(--alta-soft); color:var(--alta)}
.more{display:block; width:100%; border:0; border-top:1px solid var(--line); background:none; padding:12px; color:var(--accent); cursor:pointer; font-weight:500}

.read{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:18px 20px; display:flex; flex-direction:column; gap:14px; min-width:0}
.meta{display:grid; grid-template-columns:auto 1fr; gap:2px 12px; font-size:13.5px; margin:0}
.meta dt{color:var(--muted)} .meta dd{margin:0; overflow-wrap:anywhere}
.actions{display:flex; gap:8px; flex-wrap:wrap}
.resumen{background:var(--soft); border-radius:8px; padding:12px 14px; display:flex; flex-direction:column; gap:6px}
.resumen p{margin:0} .resumen ul{margin:0; padding-left:20px; font-size:14px}
.cuerpo{white-space:pre-wrap; overflow-wrap:anywhere; font-size:14px; line-height:1.55}
.file{border:1px solid var(--line); border-radius:8px; padding:8px 12px}
.file summary{cursor:pointer; font-size:13.5px}
.file pre{white-space:pre-wrap; overflow-wrap:anywhere; font:12px/1.45 var(--f-mono); max-height:360px; overflow:auto; margin:8px 0 0}
.hilo{display:flex; flex-direction:column; border:1px solid var(--line); border-radius:8px; overflow:hidden}
.hilo .row{padding:8px 12px}
.back{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--panel); color:var(--accent); padding:6px 12px; border-radius:8px; cursor:pointer; align-self:flex-start; font-weight:600}
.back:hover{background:var(--accent-soft)}
.casillas{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.casillas .lbl{font-size:12.5px; color:var(--muted)}
.seg{display:flex; gap:2px; background:var(--soft); padding:3px; border-radius:10px; flex-wrap:wrap}
.seg button{border:0; background:none; padding:6px 12px; border-radius:8px; cursor:pointer; color:var(--muted); font-weight:500; font-size:14px}
.seg .nl-n{color:var(--accent); font-weight:700}
.seg button[aria-pressed="true"]{background:var(--panel); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08)}
.progreso{display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; font-size:12.5px; color:var(--muted)}
.barra{width:140px; height:6px; background:var(--soft); border-radius:999px; overflow:hidden}
.barra i{display:block; height:100%; background:var(--accent); border-radius:999px}
.progreso b{color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums}
.vacio{color:var(--muted); text-align:center; padding:40px 16px; margin:0}

.sinc{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.sinc .girando{display:inline-block; animation:girar 1s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}

/* Lectura tipo Outlook */
.readbar{display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap}
.asunto{font-size:21px; line-height:1.3}
.remite{display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center}
.avatar{width:42px; height:42px; border-radius:50%; display:grid; place-items:center; font-weight:600; font-size:15px; color:#fff; background:hsl(var(--h) 45% 45%)}
.remite-txt{min-width:0; overflow-wrap:anywhere}
.fecha-msg{white-space:nowrap; align-self:start; padding-top:3px}
.adjs{display:flex; flex-wrap:wrap; gap:8px}
.adj{display:inline-flex; align-items:center; gap:8px; max-width:100%; border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:6px 10px; cursor:pointer; font-size:13px}
.adj[aria-expanded="true"]{border-color:var(--accent); background:var(--accent-soft)}
.adj .ext{font:600 10.5px/1 var(--f-mono); background:var(--accent); color:var(--accent-ink); border-radius:4px; padding:4px 5px}
.adj-n{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:220px}
.adj-texto{border:1px solid var(--line); border-radius:8px; padding:10px 12px; background:var(--bg)}
.adj-acc{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:8px}
.adj-acc strong{margin-right:auto; overflow-wrap:anywhere}
.visor-img{display:block; max-width:100%; border-radius:6px; margin:6px 0}
.visor-doc{display:block; width:100%; height:75vh; border:1px solid var(--line); border-radius:6px; background:#fff; margin:6px 0}
.adj-texto pre{white-space:pre-wrap; overflow-wrap:anywhere; font:12px/1.45 var(--f-mono); max-height:360px; overflow:auto; margin:6px 0 0}
.hoja{background:#fff; color:#1f2328; border:1px solid var(--line); border-radius:8px; overflow:hidden}
.hoja .cuerpo{padding:18px 20px}
.correo-html{display:block; width:100%; border:0; height:300px; background:#fff}
.enlace{border:0; background:none; color:var(--accent); cursor:pointer; padding:0; align-self:flex-start}
details.resumen summary{cursor:pointer; list-style:none} details.resumen summary::-webkit-details-marker{display:none}
@media (max-width:560px){ .remite{grid-template-columns:auto 1fr} .fecha-msg{grid-column:2} .hoja .cuerpo{padding:14px} }

.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(18px + env(safe-area-inset-bottom, 0px)); z-index:50;
  background:#1d2433; color:#fff; padding:12px 16px; border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.25); font-size:14.5px;
  display:flex; gap:12px; align-items:center; max-width:calc(100% - 32px)}
.toast.bien{background:#176a49} .toast.mal{background:#9b2f17}
.toast .btn.sec{background:#fff; color:#1d2433}

/* Sugerencias de contactos */
.campo{position:relative}
.sugs{position:absolute; left:0; right:0; top:100%; margin-top:4px; background:#fff; border:1px solid var(--line); border-radius:8px;
  box-shadow:0 8px 24px rgba(20,26,40,.14); z-index:20; max-height:280px; overflow:auto}
.sug{display:flex; gap:10px; align-items:center; width:100%; text-align:left; border:0; background:none; padding:8px 12px; cursor:pointer; color:var(--ink)}
.sug[aria-selected="true"], .sug:hover{background:var(--accent-soft)}
.sug .avatar{width:30px; height:30px; font-size:12px; flex:none}
.sug .t{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sug .t small{color:var(--muted)}

/* Responder */
.compose{border:1px solid var(--accent); border-radius:10px; padding:14px; display:flex; flex-direction:column; gap:10px; background:var(--panel)}
.compose label{font-size:12.5px; color:var(--muted); display:flex; flex-direction:column; gap:4px}
.compose label.check{flex-direction:row; align-items:center; gap:8px; color:var(--ink); font-size:14px}
.compose label.check input{width:auto}
.compose select{width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--bg); font:inherit; color:inherit}
.compose input, .compose textarea{width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--bg); font:inherit; color:inherit}
.compose textarea{min-height:190px; resize:vertical; line-height:1.5}
.btn.sec{background:var(--soft); color:var(--ink); font-weight:500}
.btn.peligro{background:var(--alta); color:#fff}
.obs{background:var(--soft); border-radius:8px; padding:10px 12px; font-size:14px; display:flex; flex-direction:column; gap:6px}
.obs ul{margin:0; padding-left:20px}
.obs .ok{color:var(--ok); font-weight:600}
.estadoEnvio{font-size:14px; font-weight:500}
.estadoEnvio.bien{color:var(--ok)} .estadoEnvio.mal{color:var(--alta)}
textarea{font:inherit}

/* Preguntar */
.chat{max-width:860px; width:100%; margin:0 auto; display:flex; flex-direction:column; gap:12px}
.ctx{display:flex; align-items:center; flex-wrap:wrap; gap:8px; background:var(--accent-soft); color:var(--accent); border-radius:8px; padding:8px 12px; font-size:13.5px}
.ctx button{border:0; background:none; color:inherit; cursor:pointer; margin-left:auto; font-weight:600}
.ask{display:flex; gap:8px; background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:10px}
.ask input{flex:1; min-width:0; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg)}
.qa{display:flex; flex-direction:column; gap:12px}
.q{align-self:flex-end; background:var(--accent); color:var(--accent-ink); padding:9px 14px; border-radius:14px 14px 4px 14px; max-width:85%; overflow-wrap:anywhere}
.a{align-self:flex-start; background:var(--panel); border:1px solid var(--line); padding:12px 16px; border-radius:14px 14px 14px 4px; max-width:100%; overflow-wrap:anywhere}
.a p{margin:0 0 8px} .a p:last-child{margin:0} .a ul{margin:0 0 8px; padding-left:20px}
.hint{color:var(--muted); font-size:13px; text-align:center; margin:0}

@media (max-width:860px){
  .split{grid-template-columns:minmax(0,1fr)}
  .split.abierto .list{display:none}
  .split:not(.abierto) .read{display:none}
  .rows{max-height:none}
}
/* Computador: toda la pantalla, como Outlook (lista y correo a lo alto, cada uno con su scroll). */
@media (min-width:861px){
  .app{max-width:none; height:100vh; height:100dvh; padding-block:12px 12px}
  #vCorreos{flex:1; min-height:0; display:flex; flex-direction:column}
  #vPreguntar{flex:1; min-height:0; overflow:auto}
  .split{flex:1; min-height:0; grid-template-columns:minmax(340px, 32%) minmax(0, 1fr); align-items:stretch}
  .list{display:flex; flex-direction:column; min-height:0}
  .rows{flex:1; min-height:0; max-height:none}
  .read{min-height:0; overflow:auto}
  .read > *{flex-shrink:0}
}
@media (min-width:1700px){ .split{grid-template-columns:minmax(420px, 28%) minmax(0, 1fr)} }
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="bloqueo" class="lock">
  <form id="formClave" class="lockbox">
    <h1>Bandeja Zoho</h1>
    <p class="muted small" style="margin:0">Tus correos están cifrados. Ingresa tu contraseña para verlos.</p>
    <input id="clave" type="password" autocomplete="current-password" placeholder="Contraseña" required>
    <label class="small muted"><input type="checkbox" id="recordar" checked> Recordar en este dispositivo (no volver a pedirla)</label>
    <p id="errClave" class="small" style="color:var(--alta);min-height:18px;margin:0"></p>
    <button class="btn" type="submit">Abrir</button>
  </form>
</div>

<div id="appwrap" class="app" hidden>
  <header>
    <div style="display:flex;flex-direction:column;gap:4px"><h1>Bandeja Zoho</h1><div class="muted small" id="estado"></div><div class="progreso" id="progreso"></div></div>
    <div class="casillas" id="casillas" hidden><span class="lbl">Casilla:</span><div class="seg" id="seg"></div></div>
    <nav class="tabs" role="tablist" aria-label="Vistas">
      <button class="tab" role="tab" id="tab-correos" data-v="correos">Correos</button>
      <button class="tab" role="tab" id="tab-preguntar" data-v="preguntar">Preguntar</button>
    </nav>
    <div class="sinc"><button class="chip" id="buscarAhora" title="Buscar correos nuevos en Zoho">🔄 Buscar ahora</button><span class="small muted" id="sincTxt"></span></div>
    <button class="btn" id="nuevo" data-nuevo>✉️ Nuevo correo</button>
    <button class="chip" id="salir" title="Olvidar la contraseña en este dispositivo">Cerrar sesión</button>
  </header>

  <section id="vCorreos">
    <div class="toolbar" style="margin-bottom:10px">
      <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="busca" type="search" autocomplete="off" placeholder="Buscar en correos y adjuntos: nombre, factura, monto, RUT…" aria-label="Buscar"></label>
      <div class="chips" id="filtros"></div>
    </div>
    <div class="split" id="split">
      <div class="list"><div class="count" id="count"></div><div class="rows" id="rows"></div></div>
      <article class="read" id="read"></article>
    </div>
  </section>

  <section id="vPreguntar" hidden>
    <div class="chat">
      <div class="ctx" id="ctx" hidden></div>
      <form class="ask" id="formAsk"><input id="qAsk" type="text" autocomplete="off" placeholder="Pregunta sobre tus correos: ¿cuánto le debo a ICB?, ¿qué dijo Marsol del horno?…"><button class="btn" id="btnAsk" type="submit">Preguntar</button></form>
      <div class="chips" id="sugerencias"></div>
      <div class="qa" id="qa"></div>
      <p class="hint" id="hintIA"></p>
    </div>
  </section>
</div>

<script>
const CAJA = /*__DATOS__*/null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const hoy = new Date();
const fmtL = ms => { const d = new Date(+ms); return d.toDateString() === hoy.toDateString() ? d.toLocaleTimeString("es-CL", {hour:"2-digit", minute:"2-digit"}) : d.toLocaleDateString("es-CL", {day:"2-digit", month:"short"}); };
const fmtF = ms => new Date(+ms).toLocaleString("es-CL", {weekday:"short", day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit"});
const hoyISO = () => new Date().toLocaleDateString("sv-SE");
const ss = { get(k){ try { return localStorage.getItem(k) || sessionStorage.getItem(k); } catch(e){ return null; } },
             set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
             del(k){ try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch(e){} } };

let D = null, MSGS = [], HILOS = {}, CUENTAS = [];
let abierto = null, busca = "", filtro = "todos", cuentaSel = "", limite = 150, ctxHilo = null;
let CLAVE = "", borrador = null;
const LEIDOS = new Set((() => { try { return JSON.parse(localStorage.getItem("correo_leidos") || "[]"); } catch(e) { return []; } })());
const noLeido = m => m.no_leido && !LEIDOS.has(m.id);
function marcarLeido(id){
  if (!LEIDOS.has(id)) { LEIDOS.add(id); try { localStorage.setItem("correo_leidos", JSON.stringify([...LEIDOS].slice(-3000))); } catch(e){} }
  if (!PEND[id]) { PEND[id] = [Date.now(), 0]; guardarPend(); programarLeidos(6000); }
}
// Leídos en línea: lo que abres aquí se marca leído en Zoho (y así en el celular y en el computador).
// PEND = {id: [cuándo lo abriste, cuándo se pidió marcarlo]}. Se reintenta hasta que Zoho lo confirme.
const PEND = (() => { try { const p = JSON.parse(localStorage.getItem("correo_pend_leidos") || "null"); if (p) return p; } catch(e) {}
  const p = {}; for (const id of LEIDOS) p[id] = [Date.now(), 0]; return p; })();
function guardarPend(){ try { localStorage.setItem("correo_pend_leidos", JSON.stringify(PEND)); } catch(e) {} }
let tLeidos = null;
function programarLeidos(ms){ clearTimeout(tLeidos); tLeidos = setTimeout(sincLeidos, ms); }
async function sincLeidos(){
  const gh = D && D._envio; if (!gh || !gh.token || !D.mensajes) return;
  const ahora = Date.now(), ids = {}, lote = [];
  for (const [id, [t, e]] of Object.entries(PEND)) {
    const m = D.mensajes[id];
    if (!m || !m.no_leido || ahora - t > 7 * 864e5) { delete PEND[id]; continue; }   // Zoho ya lo tiene leído
    if (ahora - e < 10 * 60000 || !m.cuenta_id || lote.length >= 300) continue;        // pedido hace poco: esperar
    (ids[m.cuenta_id] ||= []).push(id); lote.push(id);
  }
  guardarPend();
  if (!lote.length) return;
  try {
    const paquete = await cifrar({ modo: "leidos", ids, ts: ahora });
    const r = await fetch(`https://api.github.com/repos/${gh.repo}/actions/workflows/correo_enviar.yml/dispatches`, { method: "POST",
      headers: { "Authorization": "Bearer " + gh.token, "Accept": "application/vnd.github+json" },
      body: JSON.stringify({ ref: "main", inputs: { paquete: JSON.stringify(paquete), id: "leidos-" + Math.random().toString(36).slice(2, 10) } }) });
    if (r.ok) { for (const id of lote) if (PEND[id]) PEND[id][1] = ahora; guardarPend(); }
  } catch(e) {}
}   // borrador: {id, para, cc, asunto, texto, obs, confirmar, estado, clase, ocupado}

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let CAJA_ACTUAL = CAJA;
async function abrir(clave){ return abrirCaja(CAJA, clave); }
async function abrirCaja(CAJA, clave){
  const pw = await crypto.subtle.importKey("raw", new TextEncoder().encode(clave), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(CAJA.salt), iterations:CAJA.iter, hash:"SHA-256"}, pw, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plano = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(CAJA.iv)}, key, b64(CAJA.ct));
  return JSON.parse(await new Response(new Blob([plano]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
}

  HILOS = {};
  for (const m of MSGS) (HILOS[m.hilo] ||= []).push(m);

    terms.every(t => m._idx.includes(t)));

// Resalta los términos sin importar tildes ni mayúsculas (la normalización mantiene el largo del texto).
function resaltar(texto, terms){
  texto = String(texto || "");
  if (!terms.length) return esc(texto);
  const n = norm(texto), marcas = new Array(texto.length).fill(false);
  for (const t of terms) { if (t.length < 2) continue; let i = n.indexOf(t); while (i >= 0) { for (let k = i; k < i + t.length; k++) marcas[k] = true; i = n.indexOf(t, i + t.length); } }
  let out = "", dentro = false;
  for (let i = 0; i < texto.length; i++) {
    if (marcas[i] && !dentro) { out += "<mark>"; dentro = true; }
    if (!marcas[i] && dentro) { out += "</mark>"; dentro = false; }
    out += esc(texto[i]);
  }
  return out + (dentro ? "</mark>" : "");
}

function fragmento(m, terms){
  if (!terms.length) return esc((m.analisis || {}).resumen || m.vista_previa || (m.texto || "").slice(0, 160));
  const fuentes = [["", m.texto || ""], ...m.archivos.map(a => ["📎 " + a.nombre + ": ", a.texto || ""])];
  for (const [pref, txt] of fuentes) {
    const i = norm(txt).indexOf(terms[0]);
    if (i >= 0) return esc(pref) + "…" + resaltar(txt.slice(Math.max(0, i - 60), i + 140).replace(/\s+/g, " "), terms) + "…";
  }
  return resaltar((m.analisis || {}).resumen || m.vista_previa || "", terms);
}

function fila(m, terms = []){

}

let adjAbierto = null, visor = {};   // visor: {ref, url, tipo, cargando, error}
const MIME = {pdf:"application/pdf", jpg:"image/jpeg", jpeg:"image/jpeg", png:"image/png", gif:"image/gif", webp:"image/webp",
  xlsx:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", xls:"application/vnd.ms-excel", csv:"text/csv",
  docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document", doc:"application/msword", txt:"text/plain", xml:"text/xml", zip:"application/zip"};
const tipoDe = n => MIME[(String(n).split(".").pop() || "").toLowerCase()] || "application/octet-stream";
const sePuedeVer = n => /^(application\/pdf|image\/|text\/)/.test(tipoDe(n));

function panelAdjunto(m, i, terms){
  const f = m.archivos[i], legible = f.texto && !String(f.texto).startsWith("(");

              : `<span class="small muted">El archivo original se está guardando; estará disponible en la próxima sincronización.</span>`}</div>
    ${v.cargando ? `<p class="small muted">Abriendo el archivo…</p>` : ""}${v.error ? `<p class="small" style="color:var(--alta)">${esc(v.error)}</p>` : ""}
    ${v.url && v.ver ? (v.tipo.startsWith("image/") ? `<img class="visor-img" src="${v.url}" alt="${esc(f.nombre)}">` : `<iframe class="visor-doc" src="${v.url}" title="${esc(f.nombre)}"></iframe>`) : ""}
    <details ${!(v.url && v.ver) ? "open" : ""}><summary class="small muted">Texto leído del archivo (lo que usa la IA)</summary>
      <pre>${legible ? resaltar(f.texto, terms) : "No se encontró texto en este archivo."}</pre></details></div>`;
}

async function archivo(f){
  const r = await fetch(`https://raw.githubusercontent.com/${D._repo || "nicolasanavalon/sii-dte"}/correo-adjuntos/adj/${f.ref}.bin`);
  if (!r.ok) throw new Error("No encontré el archivo guardado (puede tardar unos minutos en aparecer después de la sincronización).");
  const caja = new Uint8Array(await r.arrayBuffer());
  const pw = await crypto.subtle.importKey("raw", new TextEncoder().encode(CLAVE), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:caja.slice(0, 16), iterations:250000, hash:"SHA-256"}, pw, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const datos = await crypto.subtle.decrypt({name:"AES-GCM", iv:caja.slice(16, 28)}, key, caja.slice(28));
  return new Blob([datos], {type: tipoDe(f.nombre)});
}

async function abrirAdjunto(m, i, ver){
  const f = m.archivos[i];
  if (visor.url && visor.ref === f.ref) { if (ver) { visor.ver = true; pintarCorreo(); } else descargar(visor.url, f.nombre); return; }
  if (visor.url) URL.revokeObjectURL(visor.url);
  visor = {ref: f.ref, cargando: true}; pintarCorreo();
  try {
    const blob = await archivo(f);
    visor = {ref: f.ref, url: URL.createObjectURL(blob), tipo: blob.type, ver};
    if (!ver) descargar(visor.url, f.nombre);
  } catch (e) { visor = {ref: f.ref, error: e.message}; }
  pintarCorreo();
}
function descargar(url, nombre){ const a = document.createElement("a"); a.href = url; a.download = nombre; a.target = "_blank"; document.body.appendChild(a); a.click(); a.remove(); }

/* ---------- agenda: sugerencias al escribir Para / Cc ---------- */
let AGENDA = [];
function armarAgenda(){
  const yo = new Set((D.propios || []).map(x => x.toLowerCase())), mapa = {};
  const sumar = (email, nombre, fecha, peso) => {
    email = String(email || "").trim().toLowerCase();
    if (!email.includes("@") || yo.has(email) || /no-?reply|noreply|notificacion|mailer-daemon/.test(email)) return;
    const c = mapa[email] ||= {email, nombre: "", n: 0, ult: 0};
    if (nombre && !nombre.includes("@") && nombre.length > (c.nombre || "").length) c.nombre = nombre.trim();
    c.n += peso; c.ult = Math.max(c.ult, fecha || 0);
  };
  for (const m of MSGS) {
    if (m.enviado) { for (const x of [...m.para, ...m.cc]) sumar(x, "", m.fecha, 3); }   // a quien TÚ escribes pesa más
    else { sumar(m.de, m.de_nombre, m.fecha, 1); for (const x of m.cc) sumar(x, "", m.fecha, 0.3); }
  }
  for (const [email, f] of Object.entries(D.contactos || {})) if (mapa[email.toLowerCase()] && f.nombre) mapa[email.toLowerCase()].nombre ||= f.nombre;
  const ahora = Date.now();
  AGENDA = Object.values(mapa).map(c => ({...c, puntaje: c.n + 6 * Math.exp(-(ahora - c.ult) / (30 * 864e5)), clave: norm(c.nombre + " " + c.email)}))
    .sort((a, b) => b.puntaje - a.puntaje);
}

let sugs = {campo: null, lista: [], sel: 0};
function tokenActual(valor){ const i = valor.lastIndexOf(","); return [valor.slice(0, i + 1), valor.slice(i + 1).trim()]; }
function mostrarSugs(input){
  cerrarSugs();

  const lista = AGENDA.filter(c => !ya.has(c.email) && c.clave.split(/[\s@._-]+/).some(p => p.startsWith(q)) || (q.length > 2 && c.clave.includes(q) && !ya.has(c.email))).slice(0, 8);
  if (!lista.length) return;

  input.parentElement.appendChild(caja);
}
function cerrarSugs(){ document.querySelectorAll(".sugs").forEach(x => x.remove()); sugs = {campo: null, lista: [], sel: 0}; }
function elegirSug(i){
  const c = sugs.lista[i], input = sugs.campo; if (!c || !input) return;

const PROPIOS = () => new Set((D.propios || []).map(x => x.toLowerCase()));
function nuevoBorrador(m, modo){

    texto: "", obs: null, confirmar: false, estado: "", clase: "", ocupado: "", con_adjuntos: true };

async function cifrar(obj){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const pw = await crypto.subtle.importKey("raw", new TextEncoder().encode(CLAVE), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:250000, hash:"SHA-256"}, pw, {name:"AES-GCM", length:256}, false, ["encrypt"]);
  const gz = new Uint8Array(await new Response(new Blob([JSON.stringify(obj)]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer());
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, gz));
  const b = u => { let t = ""; for (let i = 0; i < u.length; i += 8192) t += String.fromCharCode(...u.subarray(i, i + 8192)); return btoa(t); };
  return {v:1, iter:250000, salt:b(salt), iv:b(iv), ct:b(ct)};
}

function md(t){
  const lineas = esc(t).split("\n"); let html = "", lista = false;
  for (let l of lineas) {
    l = l.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    const m = l.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)/);
    if (m) { if (!lista) { html += "<ul>"; lista = true; } html += `<li>${m[1]}</li>`; continue; }
    if (lista) { html += "</ul>"; lista = false; }
    if (l.trim()) html += `<p>${l.replace(/^#+\s*/, "")}</p>`;
  }
  return html + (lista ? "</ul>" : "");
}

function textoHilo(ms, limite){
  let out = "";
  for (const m of [...ms].reverse()) {
    let p = `--- CORREO del ${fmtF(m.fecha)} | ${m.enviado ? "ENVIADO por Nicolás" : "RECIBIDO"} | De: ${m.de_nombre || ""} <${m.de}> | Para: ${m.para.join(", ")} | Asunto: ${m.asunto}\n${m.texto || m.vista_previa || ""}\n`;
    for (const a of m.archivos) p += `[ADJUNTO ${a.nombre}]\n${a.texto && !String(a.texto).startsWith("(") ? a.texto : "(sin texto legible)"}\n[FIN ADJUNTO]\n`;
    if (out.length + p.length > limite) { out += p.slice(0, Math.max(0, limite - out.length)) + "\n[…recortado]\n"; break; }
    out += p;
  }
  return out;
}

const VACIAS = new Set("que cual cuales cuanto cuanta cuando como donde para por los las del con una uno unos unas tengo debo hay sobre este esta ese esa algo dijo dice tiene".split(" "));
function contextoGeneral(q){
  const terms = norm(q).split(/[^a-z0-9ñ]+/).filter(t => t.length > 2 && !VACIAS.has(t));
  const puntaje = {}, base = MSGS.filter(m => !cuentaSel || m.cuenta === cuentaSel);
  for (const m of base) {
    let s = 0; for (const t of terms) { if (norm(m.asunto + " " + m.de_nombre + " " + m.de).includes(t)) s += 4; if (m._idx.includes(t)) s += 2; }
    if (s) puntaje[m.hilo] = Math.max(puntaje[m.hilo] || 0, s + m.fecha / 1e14);
  }
  const mejores = Object.entries(puntaje).sort((a, b) => b[1] - a[1]).slice(0, 6).map(x => x[0]);
  let texto = "";
  for (const hid of mejores) {
    const ms = HILOS[hid], h = (D.hilos || {})[hid] || {}, ult = ms.at(-1);
    let bloque = `\n### Conversación "${ult.asunto}" con ${ult.de_nombre || ult.contacto} (último correo ${fmtF(ult.fecha)})\n${h.resumen ? "Resumen: " + h.resumen + "\n" : ""}${(h.puntos_clave || []).length ? "Puntos clave: " + h.puntos_clave.join("; ") + "\n" : ""}`;
    for (const m of [...ms].reverse()) {
      const fuentes = [[`correo del ${fmtF(m.fecha)} de ${m.de_nombre || m.de}`, m.texto || ""], ...m.archivos.map(a => [`adjunto ${a.nombre} (correo del ${fmtF(m.fecha)})`, a.texto || ""])];
      for (const [donde, txt] of fuentes) { const n = norm(txt);
        for (const t of terms) { const i = n.indexOf(t); if (i >= 0) { bloque += `(${donde}) …${txt.slice(Math.max(0, i - 400), i + 600)}…\n`; break; } } }
      if (bloque.length > 4500) break;
    }
    if (texto.length + bloque.length > 10000) break;
    texto += bloque;
  }
  const indice = base.slice(0, 60).map(m => `- ${fmtL(m.fecha)} | ${m.enviado ? "enviado a " + (m.para[0] || "") : (m.de_nombre || m.de)} | ${m.asunto}`).join("\n");
  return `ÚLTIMOS CORREOS (índice):\n${indice.slice(0, 3000)}\n\nCORREOS RELACIONADOS CON LA PREGUNTA:${texto || "\n(ninguno coincide con las palabras de la pregunta)"}`;
}

const MODELOS_QA = ["openai/gpt-oss-120b", "llama-3.3-70b-versatile", "openai/gpt-oss-20b", "llama-3.1-8b-instant"];
async function groq(sistema, usuario, json = false){
  const ia = D._ia;
  if (!ia || !ia.clave) throw new Error("La IA todavía no está activada (falta la clave gratuita de Groq).");
  const modelos = [ia.modelo, ...(ia.modelos || []), ...MODELOS_QA].filter((m, i, a) => m && a.indexOf(m) === i);
  let error = "La IA no pudo responder.";
  for (const modelo of modelos) {
    const r = await fetch("https://api.groq.com/openai/v1/chat/completions", { method: "POST",
      headers: { "Authorization": "Bearer " + ia.clave, "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({ model: modelo, temperature: 0.2, max_tokens: 1500,
        messages: [{ role: "system", content: sistema }, { role: "user", content: usuario }] },
        modelo.includes("gpt-oss") ? { reasoning_effort: "low" } : {}, json ? { response_format: { type: "json_object" } } : {})) }).catch(() => null);
    if (r && r.ok) { const j = await r.json(); return (j.choices[0].message.content || "").replace(/<think>[\s\S]*?<\/think>/g, "").trim(); }
    error = !r ? "Sin conexión con la IA." : r.status === 429 ? "Se alcanzó el límite gratis de preguntas por ahora. Prueba en un minuto." : `La IA no pudo responder (${r.status}).`;
    if (r && ![400, 404, 413, 429].includes(r.status)) break;
  }
  throw new Error(error);
}

  item.innerHTML = `<div class="q">${esc(q)}</div><div class="a"><p class="muted">Buscando en tus correos…</p></div>`;
  $("#qa").prepend(item);
  const btn = $("#btnAsk"); btn.disabled = true;
  try {
    const contexto = ctxHilo ? `CONVERSACIÓN COMPLETA (todos sus correos, la cadena citada y el texto de los adjuntos):\n${textoHilo(HILOS[ctxHilo], 13000)}` : contextoGeneral(q);
    const r = await groq(INSTRUCCION, `Fecha de hoy: ${hoyISO()}.\n\n${contexto}\n\nPREGUNTA DE NICOLÁS: ${q}`);
    item.querySelector(".a").innerHTML = md(r || "Sin respuesta.");
  } catch (e) { item.querySelector(".a").innerHTML = `<p class="muted">${esc(e.message)}</p>`; }
  finally { btn.disabled = false; }
});

/* ---------- navegación ---------- */
function irA(v){
  $("#vCorreos").hidden = v !== "correos"; $("#vPreguntar").hidden = v !== "preguntar";
  for (const t of document.querySelectorAll(".tab")) t.setAttribute("aria-selected", t.dataset.v === v);
  if (v === "preguntar") { pintarCtx(); $("#qAsk").focus(); }
}
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-v],[data-m],[data-f],[data-cu],[data-back],[data-more],[data-askthread],[data-noctx],[data-sug],[data-responder],[data-r],[data-adj],[data-vertexto],[data-ver],[data-bajar],[data-nuevo],[data-recuperar]");
  if (!t) return;
  if (t.dataset.adj !== undefined) { const i = +t.dataset.adj; leerBorrador(); adjAbierto = adjAbierto === i ? null : i; pintarCorreo(); return; }
  if (t.dataset.ver !== undefined || t.dataset.bajar !== undefined) { const mm = MSGS.find(x => x.id === abierto); if (mm) abrirAdjunto(mm, +(t.dataset.ver ?? t.dataset.bajar), t.dataset.ver !== undefined); return; }
  if ("vertexto" in t.dataset) { leerBorrador(); verTexto = !verTexto; pintarCorreo(); return; }
  const m = MSGS.find(x => x.id === abierto);
  if ("recuperar" in t.dataset && recuperable) { borrador = recuperable.copia; abierto = recuperable.mid || "__nuevo__"; recuperable = null; $("#toast").hidden = true;
    irA("correos"); pintarLista(); pintarCorreo(); return; }
  if ("nuevo" in t.dataset) { irA("correos"); borrador = nuevoBorrador(null, "nuevo"); abierto = "__nuevo__"; pintarLista(); pintarCorreo(); setTimeout(() => $("#rPara") && $("#rPara").focus(), 0); if (innerWidth <= 860) scrollTo(0, 0); return; }
  if (t.dataset.responder && m) { const modo = t.dataset.responder; if (!borrador || borrador.id !== m.id || (borrador.modo === "reenviar") !== (modo === "reenviar")) borrador = nuevoBorrador(m, modo); pintarCorreo();
    setTimeout(() => { const e = modo === "reenviar" ? $("#rPara") : $("#rTexto"); if (e) { e.focus(); if (e.id === "rTexto") e.setSelectionRange(0, 0); } }, 0); return; }
  if (t.dataset.r && borrador && (m || borrador.modo === "nuevo")) {
    const a = t.dataset.r; leerBorrador();
    if (a === "sugerir") sugerir(m);
    else if (a === "mejorar") mejorar(m);
    else if (a === "deshacer") { borrador.texto = borrador.anterior || borrador.texto; borrador.anterior = ""; borrador.obs = null; pintarCorreo(); }
    else if (a === "revisar") revisar(m);
    else if (a === "usar") { borrador.texto = borrador.corregida || borrador.texto; borrador.obs = null; pintarCorreo(); }
    else if (a === "enviar") { if (!listaCorreos(borrador.para).length || !borrador.texto.trim()) { borrador.estado = "Falta el destinatario o el mensaje."; borrador.clase = "mal"; } else { borrador.confirmar = true; borrador.estado = ""; } pintarCorreo(); }
    else if (a === "noenviar") { borrador.confirmar = false; pintarCorreo(); }
    else if (a === "confirmar") enviar(m);
    else if (a === "cancelar") { if (borrador.modo === "nuevo") { abierto = null; pintarLista(); } borrador = null; pintarCorreo(); }
    return;
  }
  if (t.dataset.v) irA(t.dataset.v);
  else if (t.dataset.m) { abierto = t.dataset.m; adjAbierto = null; verTexto = false; marcarLeido(abierto); pintarFiltros(); pintarLista(); pintarCorreo(); if (innerWidth <= 860) scrollTo(0, 0); }
  else if (t.dataset.f) { filtro = t.dataset.f; limite = 150; pintarFiltros(); pintarLista(); }
  else if ("cu" in t.dataset) { cuentaSel = t.dataset.cu; limite = 150; abierto = null; pintarFiltros(); pintarLista(); pintarCorreo(); irA("correos"); }
  else if ("back" in t.dataset) { const id = abierto; abierto = null; pintarLista(); pintarCorreo();
    const fila = document.querySelector(`.row[data-m="${CSS.escape(id || "")}"]`); if (fila) fila.scrollIntoView({block: "center"}); }
  else if ("more" in t.dataset) { limite += 150; pintarLista(); }
  else if (t.dataset.askthread) { ctxHilo = t.dataset.askthread; irA("preguntar"); }
  else if ("noctx" in t.dataset) { ctxHilo = null; pintarCtx(); }
  else if (t.dataset.sug) { $("#qAsk").value = t.dataset.sug; $("#formAsk").requestSubmit(); }
});
document.addEventListener("input", ev => { if (ev.target.closest(".compose")) { leerBorrador();
  for (const k of ["revisar", "mejorar"]) { const b = document.querySelector(`[data-r="${k}"]`); if (b && !borrador.ocupado) b.disabled = !borrador.texto.trim(); } } });
let tBusca;
$("#busca").addEventListener("input", ev => { clearTimeout(tBusca); tBusca = setTimeout(() => { busca = ev.target.value.trim(); limite = 150; pintarLista(); pintarCorreo(); }, 150); });

/* ---------- correos nuevos: casi en tiempo real ---------- */
// Un "vigilante" en GitHub revisa Zoho cada minuto y guarda los datos (cifrados) en la rama correo-datos.
// La página la revisa cada 30 segundos y, si hay algo nuevo, lo descarga y lo muestra sin recargar.
let versionActual = null, buscando = false;
const horaTxt = ms => new Date(ms || Date.now()).toLocaleTimeString("es-CL", {hour: "2-digit", minute: "2-digit"});
function sinc(txt, gira){ $("#sincTxt").innerHTML = esc(txt); $("#buscarAhora").innerHTML = (gira ? '<span class="girando">🔄</span>' : "🔄") + " Buscar ahora"; }

async function deDatos(archivo){
  const gh = (D && D._envio) || {}, repo = gh.repo || (D && D._repo) || "nicolasanavalon/sii-dte";
  const url = `https://api.github.com/repos/${repo}/contents/${archivo}?ref=correo-datos`;
  const h = { "Accept": "application/vnd.github.raw" };
  if (gh.token) h.Authorization = "Bearer " + gh.token;
  let r = await fetch(url, { headers: h, cache: "no-store" });
  if ((r.status === 401 || r.status === 403) && h.Authorization) { delete h.Authorization; r = await fetch(url, { headers: h, cache: "no-store" }); }
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
async function revisarZoho(manual){
  if (buscando || !D) return; buscando = true;
  if (manual) sinc("Revisando…", true);
  try {
    const v = await deDatos("version.json");
    let n = 0;
    if (v.v && v.v !== versionActual) {
      const caja = await deDatos("caja.json");
      if (caja && caja.ct && caja.ct !== CAJA_ACTUAL.ct) {
        const antes = new Set(MSGS.map(m => m.id));
        const nuevoD = await abrirCaja(caja, CLAVE);
        CAJA_ACTUAL = caja; leerBorrador(); D = nuevoD; construir(true);
        n = MSGS.filter(m => !antes.has(m.id) && !m.local).length;
      }
      versionActual = v.v;
    }
    const atraso = Date.now() - (v.ms || 0);
    sinc(n ? `${n} correo${n > 1 ? "s" : ""} nuevo${n > 1 ? "s" : ""} · ${horaTxt()}`
           : atraso < 5 * 60000 ? `Al día · Zoho revisado ${horaTxt(v.ms)}` : `⚠️ Última revisión de Zoho: ${horaTxt(v.ms)}`);
  } catch(e) { sinc(manual ? "No se pudo revisar; reintento en 30 s." : ($("#sincTxt").textContent || "")); }
  buscando = false;
}
$("#buscarAhora").addEventListener("click", () => { buscando = false; revisarZoho(true); });
setInterval(() => { if (D && document.visibilityState === "visible") revisarZoho(false); }, 30000);
document.addEventListener("visibilitychange", () => { if (D && document.visibilityState === "visible") revisarZoho(false); });

/* ---------- entrar ---------- */
async function entrar(clave, recordar){
  D = await abrir(clave); CLAVE = clave;
  if (recordar) ss.set("correo_clave", clave);
  $("#bloqueo").hidden = true; $("#appwrap").hidden = false;
  construir(); irA("correos");
  revisarZoho(false);
}
$("#salir").addEventListener("click", () => { ss.del("correo_clave"); location.reload(); });
$("#formClave").addEventListener("submit", async ev => {
  ev.preventDefault(); const err = $("#errClave"); err.textContent = "Abriendo…";
  try { await entrar($("#clave").value, $("#recordar").checked); } catch(e) { err.textContent = "Contraseña incorrecta."; }
});
(async () => {
  if (!CAJA) { $("#errClave").textContent = "Aún no hay datos: espera la primera sincronización."; return; }
  const g = ss.get("correo_clave"); if (g) { try { await entrar(g, false); } catch(e) {} }
})();
</script>
